<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Newsroom Monitor</title>
    <style>
      :root {
        color-scheme: light;
        --stone: #e5e3d7;
        --wine: #6d1a36;
        --green: #33673b;
        --signal: #e4572e;
        --navy: #083d77;
        --bg: #eef0ea;
        --panel: #fffefa;
        --panel-2: #f7f7f1;
        --ink: #172231;
        --muted: #607080;
        --line: #d7d8cf;
        --line-strong: #9ea8a1;
        --accent: #083d77;
        --accent-ink: #062a52;
        --urgent: #6d1a36;
        --warn: #e4572e;
        --success: #33673b;
        --soft: #e7eef6;
        --amber-soft: #fde8de;
        --red-soft: #f2dbe3;
        --green-soft: #e3efe5;
        --shadow: 0 1px 2px rgba(8, 61, 119, 0.06), 0 12px 30px rgba(8, 61, 119, 0.08);
        --shadow-soft: 0 1px 3px rgba(8, 61, 119, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(180deg, rgba(8, 61, 119, 0.1), rgba(229, 227, 215, 0) 240px),
          var(--bg);
        color: var(--ink);
        font-family: Arial, "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 12px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 254, 250, 0.94);
        backdrop-filter: blur(12px);
        position: relative;
        z-index: 20;
      }

      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0;
        white-space: nowrap;
      }

      h1::after {
        content: "LIVE";
        display: inline-flex;
        margin-left: 10px;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--wine);
        color: #fffefa;
        font-size: 11px;
        vertical-align: middle;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(110px, 130px) minmax(240px, 1fr) minmax(92px, 110px) minmax(86px, 100px) minmax(76px, 92px) minmax(92px, 108px) minmax(104px, 120px);
        gap: 6px;
        align-items: center;
        justify-content: stretch;
      }

      .toolbar input,
      .toolbar select,
      .toolbar button {
        width: 100%;
        min-width: 0;
      }

      .toolbar .search-input {
        min-width: 220px;
      }

      .toolbar select[multiple] {
        height: 34px;
        min-height: 34px;
        padding: 3px 6px;
        line-height: 1.18;
        overflow: auto;
      }

      .toolbar select:not([multiple]),
      .toolbar input,
      .toolbar button {
        height: 34px;
      }

      .quickbar,
      .presetbar,
      .sourcebar,
      .filterbar {
        grid-column: 1 / -1;
        display: flex;
        gap: 5px;
        flex-wrap: nowrap;
        align-items: center;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
        min-width: 0;
      }

      .quickbar:empty,
      .presetbar:empty,
      .sourcebar:empty,
      .filterbar:empty {
        display: none;
      }

      .quickbar button {
        flex: 0 0 auto;
        height: 27px;
        padding: 0 9px;
        border-radius: 999px;
        background: rgba(255, 254, 250, 0.84);
        color: #334455;
        font-size: 12px;
      }

      .quickbar button.active {
        border-color: var(--accent);
        background: var(--navy);
        color: #fffefa;
      }

      .live-status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        flex: 0 0 auto;
        white-space: nowrap;
      }

      .presetbar button {
        flex: 0 0 auto;
        height: 27px;
        padding: 0 9px;
        border-color: rgba(8, 61, 119, 0.18);
        background: var(--soft);
        color: var(--accent-ink);
        font-size: 12px;
      }

      .presetbar select,
      .presetbar input {
        flex: 0 0 auto;
        width: auto;
        height: 27px;
        font-size: 12px;
      }

      .presetbar input[type="date"] {
        min-width: 124px;
      }

      .sourcebar button {
        flex: 0 0 auto;
        height: 27px;
        padding: 0 9px;
        border-color: rgba(51, 103, 59, 0.18);
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
      }

      .sourcebar {
        flex-wrap: wrap;
        align-content: flex-start;
        max-height: 59px;
        overflow: hidden;
      }

      .sourcebar button.active {
        border-color: var(--green);
        background: var(--green);
        color: #fffefa;
      }

      .utilitybar {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
        padding: 5px 6px;
        border: 1px solid rgba(8, 61, 119, 0.1);
        border-radius: 8px;
        background: rgba(255, 254, 250, 0.72);
      }

      .utility-actions {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
        flex-wrap: wrap;
        align-items: center;
      }

      .utilitybar button {
        flex: 0 0 auto;
        height: 28px;
        min-width: 66px;
        padding: 0 9px;
        font-size: 12px;
        white-space: nowrap;
      }

      #allArticles {
        border-color: var(--navy);
        background: var(--navy);
        color: #fffefa;
      }

      #resetFilters,
      #scrollTop {
        background: #fffefa;
        color: var(--muted);
      }

      .utilitybar button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .mission-toggle.active {
        border-color: var(--urgent);
        background: var(--urgent);
        color: #fffefa;
      }

      body[data-mission="on"] h1::after {
        content: "BREAKING";
        background: var(--signal);
      }

      .view-chip {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        min-height: 24px;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fffefa;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .view-chip.active {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent-ink);
      }

      input,
      select,
      textarea,
      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
      }

      input,
      select,
      button {
        height: 38px;
      }

      input {
        width: min(300px, 40vw);
        padding: 0 10px;
      }

      select {
        padding: 0 8px;
      }

      textarea {
        min-height: 72px;
        padding: 8px;
        resize: vertical;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 600;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease, transform 120ms ease;
      }

      button:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-soft);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      button.live-active {
        border-color: var(--urgent);
        background: var(--urgent);
        color: #fffefa;
      }

      button.danger {
        border-color: var(--urgent);
        color: var(--urgent);
      }

      main {
        display: grid;
        grid-template-columns: 280px minmax(480px, 1fr) 320px;
        gap: 10px;
        padding: 10px;
      }

      .panel,
      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow-soft);
      }

      .panel {
        overflow: hidden;
      }

      .panel h2,
      details.panel > summary {
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        font-weight: 800;
        background: linear-gradient(90deg, #f7f7f1, #edf2f7);
      }

      details.panel > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        list-style: none;
      }

      details.panel > summary::-webkit-details-marker {
        display: none;
      }

      details.panel > summary::after {
        content: "펼치기";
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      details.panel[open] > summary::after {
        content: "접기";
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      .side-body {
        display: grid;
        gap: 7px;
        padding: 10px;
      }

      .ops-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ops-status {
        grid-column: 1 / -1;
      }

      .side-body > input,
      .side-body > select,
      .side-body > button {
        width: 100%;
        min-width: 0;
      }

      .run-filter {
        gap: 8px;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        width: 100%;
        border: 0;
        background: #eef4ef;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
        color: #244a2b;
        text-align: left;
      }

      .stat.warning {
        background: var(--amber-soft);
        color: #8f331c;
      }

      .stat.danger {
        background: var(--red-soft);
        color: var(--wine);
      }

      .stat[data-stat-filter],
      .stat[data-stat-category] {
        border: 1px solid transparent;
        cursor: pointer;
      }

      .stat[data-stat-filter]:hover,
      .stat[data-stat-filter]:focus-visible,
      .stat[data-stat-filter].active,
      .stat[data-stat-category]:hover,
      .stat[data-stat-category]:focus-visible,
      .stat[data-stat-category].active {
        border-color: currentColor;
        box-shadow: 0 0 0 2px rgba(8, 61, 119, 0.08);
        outline: none;
      }

      .source-warning-card {
        display: grid;
        gap: 6px;
        padding: 9px;
        border: 1px solid var(--line);
        border-left: 3px solid #d78b2f;
        border-radius: 7px;
        background: #fffefa;
      }

      .source-warning-card.danger {
        border-left-color: var(--wine);
        background: linear-gradient(90deg, rgba(109, 26, 54, 0.08), #fffefa 42%);
      }

      .source-warning-card.diagnostic {
        border-left-color: var(--accent);
        background: linear-gradient(90deg, rgba(8, 61, 119, 0.07), #fffefa 44%);
      }

      .source-warning-head {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        justify-content: space-between;
        min-width: 0;
      }

      .source-warning-head strong {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .source-warning-label {
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 700;
        color: var(--wine);
      }

      .source-warning-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .warning-chip {
        padding: 3px 6px;
        border-radius: 999px;
        background: #eef4ef;
        color: #2e5b36;
        font-size: 11px;
        line-height: 1.2;
      }

      .warning-chip.danger {
        background: var(--red-soft);
        color: var(--wine);
      }

      .warning-chip.warning {
        background: var(--amber-soft);
        color: #8f331c;
      }

      .crawl-progress {
        display: grid;
        gap: 6px;
        padding: 10px;
        border-radius: 6px;
        background: var(--soft);
        color: var(--accent-ink);
        font-size: 13px;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(8, 61, 119, 0.14);
      }

      .progress-bar {
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 160ms ease;
      }

      .run,
      .cluster {
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        font-size: 13px;
        line-height: 1.45;
      }

      .failed {
        color: var(--warn);
      }

      .run.stalled {
        color: var(--wine);
      }

      .list {
        display: grid;
        gap: 10px;
        align-content: start;
        align-items: start;
        min-width: 0;
      }

      .list.loading {
        opacity: 0.72;
        transition: opacity 120ms ease;
      }

      .pagination {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
      }

      .pagination button {
        width: auto;
        min-width: 34px;
        height: 32px;
        padding: 0 10px;
      }

      .pagination button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .pagination span {
        color: var(--muted);
        font-size: 13px;
      }

      .detail-panel {
        position: sticky;
        top: 16px;
        align-self: start;
        max-height: calc(100vh - 32px);
        overflow: auto;
        min-width: 0;
      }

      article {
        display: grid;
        gap: 5px;
        align-content: start;
        align-self: start;
        padding: 10px 12px;
        border-left: 4px solid transparent;
        height: fit-content;
        min-width: 0;
      }

      article.read {
        opacity: 0.68;
      }

      article.selected {
        border-color: rgba(8, 61, 119, 0.35);
        box-shadow: 0 0 0 2px rgba(8, 61, 119, 0.08), var(--shadow-soft);
      }

      article[data-priority="high"] {
        border-left-color: var(--urgent);
      }

      article[data-priority="medium"] {
        border-left-color: var(--warn);
      }

      article h3 {
        margin: 0;
        font-size: 16px;
        line-height: 1.28;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      article a {
        color: inherit;
        text-decoration: none;
      }

      article a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .article-label {
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 800;
      }

      .article-body {
        color: #3f4b58;
        font-size: 13px;
        line-height: 1.42;
        overflow-wrap: anywhere;
        align-self: start;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      mark {
        border-radius: 3px;
        background: #fde8de;
        color: var(--ink);
        padding: 0 2px;
      }

      .meta,
      .tags,
      .actions,
      .workflow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .tag {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--stone);
        color: #314052;
        font-size: 12px;
      }

      .tag.warning {
        background: var(--amber-soft);
        color: #8f331c;
        font-weight: 700;
      }

      .score {
        color: var(--urgent);
        font-weight: 700;
      }

      .author-meta {
        color: #1f5f4a;
        font-weight: 800;
      }

      .reliability-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f8faf4;
        color: #34404e;
        font-size: 12px;
        line-height: 1.35;
      }

      .reliability-strip.high,
      .reliability-badge.high,
      .reliability-tag.high {
        border-color: rgba(51, 103, 59, 0.26);
        background: var(--green-soft);
        color: var(--green);
      }

      .reliability-strip.medium,
      .reliability-badge.medium,
      .reliability-tag.medium {
        border-color: rgba(8, 61, 119, 0.2);
        background: var(--soft);
        color: var(--accent-ink);
      }

      .reliability-strip.warning,
      .reliability-badge.warning,
      .reliability-tag.warning {
        border-color: rgba(228, 87, 46, 0.32);
        background: var(--amber-soft);
        color: #8f331c;
      }

      .reliability-strip.danger,
      .reliability-badge.danger,
      .reliability-tag.danger {
        border-color: rgba(109, 26, 54, 0.28);
        background: var(--red-soft);
        color: var(--wine);
      }

      .reliability-badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-weight: 800;
      }

      .reliability-detail {
        color: inherit;
        opacity: 0.9;
      }

      .reliability-missing {
        font-weight: 800;
      }

      .workflow select,
      .workflow input {
        width: 140px;
        height: 32px;
        font-size: 12px;
      }

      .workflow button {
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
      }

      .source-distance {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .assist {
        white-space: pre-wrap;
        border-left: 3px solid var(--accent);
        padding: 10px 12px;
        background: var(--soft);
        color: #17324e;
        font-size: 13px;
        line-height: 1.5;
      }

      .summary {
        color: #3f4b58;
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .summary a,
      .detail-panel strong {
        overflow-wrap: anywhere;
      }

      .detail-panel .stack {
        min-width: 0;
      }

      .empty {
        padding: 20px;
        color: var(--muted);
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        color: var(--ink);
        font-size: 14px;
        z-index: 50;
      }

      .status-pill {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--stone);
        color: #34404e;
      }

      .status-pill.review {
        background: var(--amber-soft);
        color: var(--warn);
      }

      .status-pill.ready {
        background: var(--green-soft);
        color: var(--success);
      }

      .status-pill.new {
        background: var(--wine);
        color: #fffefa;
      }

      .category-pill {
        border: 1px solid rgba(8, 61, 119, 0.16);
        background: #eef4fb;
        color: var(--accent-ink);
      }

      .category-pill.disaster,
      .category-pill.weather {
        border-color: rgba(228, 87, 46, 0.28);
        background: #fde8de;
        color: #8f331c;
      }

      .category-pill.fire,
      .category-pill.police {
        border-color: rgba(109, 26, 54, 0.25);
        background: #f2dbe3;
        color: var(--wine);
      }

      .category-pill.government,
      .category-pill.health {
        border-color: rgba(51, 103, 59, 0.28);
        background: #e3efe5;
        color: var(--green);
      }

      .urgent-rail {
        display: grid;
        gap: 8px;
      }

      .coverage-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .coverage-card {
        display: grid;
        gap: 2px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--muted);
        font-size: 11px;
      }

      .coverage-card strong {
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
      }

      .coverage-card.danger {
        border-color: rgba(109, 26, 54, 0.28);
        background: var(--red-soft);
        color: var(--wine);
      }

      .coverage-card.warning {
        border-color: rgba(228, 87, 46, 0.32);
        background: var(--amber-soft);
        color: #8f331c;
      }

      .coverage-card.success {
        border-color: rgba(51, 103, 59, 0.28);
        background: var(--green-soft);
        color: var(--green);
      }

      .coverage-risk {
        display: grid;
        gap: 3px;
        padding: 8px;
        border-left: 3px solid var(--warn);
        background: #fffefa;
        font-size: 12px;
        line-height: 1.4;
      }

      .region-list {
        display: grid;
        gap: 6px;
      }

      .region-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 13px;
        text-align: left;
      }

      .region-row.active {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent-ink);
      }

      .region-row strong {
        font-size: 14px;
      }

      .urgent-summary {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(109, 26, 54, 0.18);
        border-radius: 8px;
        background: #fff8f9;
      }

      .urgent-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }

      .urgent-metric {
        display: grid;
        gap: 2px;
        padding: 7px;
        border-radius: 6px;
        background: #fffefa;
        color: var(--muted);
        font-size: 11px;
      }

      .urgent-metric strong {
        color: var(--ink);
        font-size: 17px;
        line-height: 1;
      }

      .urgent-controls {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .urgent-controls button {
        height: 30px;
        padding: 0 8px;
        font-size: 12px;
      }

      .urgent-controls button.active {
        border-color: var(--wine);
        background: var(--wine);
        color: #fffefa;
      }

      .urgent-item {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(109, 26, 54, 0.2);
        border-left: 4px solid var(--warn);
        border-radius: 8px;
        background: #fffefa;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.45;
      }

      .urgent-item.critical {
        border-left-color: var(--wine);
        background: #fff8f9;
      }

      .urgent-item.high {
        border-left-color: var(--warn);
        background: #fffaf6;
      }

      .urgent-head {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: space-between;
      }

      .urgent-level {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--amber-soft);
        color: var(--warn);
        font-size: 11px;
        font-weight: 800;
      }

      .urgent-level.critical {
        background: var(--wine);
        color: #fffefa;
      }

      .urgent-title {
        margin: 0;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .urgent-reasons,
      .urgent-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }

      .urgent-chip {
        padding: 3px 6px;
        border-radius: 999px;
        background: var(--stone);
        color: #34404e;
        font-size: 11px;
      }

      .urgent-actions button,
      .urgent-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .urgent-actions .primary-link {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .urgent-item.flash {
        animation: flashUrgent 900ms ease-in-out 2;
      }

      @keyframes flashUrgent {
        0%,
        100% {
          background: #fff8f9;
        }
        50% {
          background: #f2dbe3;
        }
      }

      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(180px, 1fr));
        gap: 10px;
        align-items: start;
      }

      .board-column {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .board-column h3 {
        margin: 0;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
        font-size: 14px;
      }

      .board-card {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        line-height: 1.45;
      }

      .quality-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        font-size: 13px;
        line-height: 1.45;
      }

      .quality-row strong {
        min-width: 0;
      }

      .quality-row.warning {
        color: #8f331c;
      }

      body[data-density="compact"] article {
        gap: 4px;
        padding: 9px 11px;
      }

      body[data-density="compact"] article h3 {
        font-size: 15px;
      }

      body[data-density="compact"] .article-body,
      body[data-density="compact"] .workflow,
      body[data-density="compact"] .actions,
      body[data-density="compact"] .reliability-detail {
        display: none;
      }

      body[data-density="detail"] article {
        gap: 8px;
      }

      .compare-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .checklist {
        display: grid;
        gap: 6px;
      }

      .checklist label {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 13px;
      }

      .checklist input[type="checkbox"] {
        width: 16px;
        height: 16px;
        min-width: 16px;
        flex: 0 0 16px;
        margin: 0;
        accent-color: var(--accent);
      }

      .verification-brief {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8faf4;
      }

      .verification-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .verification-actions a,
      .verification-actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .verification-actions a.primary-link {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .evidence-list {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }

      .reporter-card {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        font-size: 13px;
        line-height: 1.42;
      }

      .reporter-card strong {
        overflow-wrap: anywhere;
      }

      .reporter-title {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      .reporter-brief {
        display: -webkit-box;
        overflow: hidden;
        color: #3f4b58;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      .reporter-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .reporter-chip {
        padding: 3px 6px;
        border-radius: 999px;
        background: #eef4ef;
        color: #2e5b36;
        font-size: 11px;
        line-height: 1.2;
      }

      .reporter-chip.warning {
        background: var(--amber-soft);
        color: #8f331c;
      }

      .reporter-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }

      .reporter-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--accent-ink);
        font-weight: 800;
      }

      .reporter-pill.hot {
        background: var(--red-soft);
        color: var(--urgent);
      }

      .reporter-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .reporter-rule {
        display: grid;
        gap: 3px;
        height: auto;
        min-height: 44px;
        padding: 8px;
        text-align: left;
        border-radius: 6px;
        background: var(--panel-2);
        font-size: 12px;
      }

      .detail-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .detail-actions button {
        min-height: 32px;
        height: auto;
        padding: 7px 8px;
        font-size: 12px;
      }

      .detail-source-list {
        display: grid;
        gap: 5px;
      }

      .detail-source-item {
        display: grid;
        gap: 3px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        font-size: 12px;
      }

      .verification-score {
        display: grid;
        gap: 5px;
        padding: 9px;
        border-radius: 7px;
        background: var(--soft);
        color: var(--accent-ink);
        font-size: 13px;
      }

      .score-track {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(8, 61, 119, 0.14);
      }

      .score-bar {
        height: 100%;
        border-radius: inherit;
        background: var(--success);
      }

      .conflict-box {
        display: grid;
        gap: 6px;
        padding: 10px;
        border-radius: 7px;
        background: var(--amber-soft);
        color: #7c311c;
        font-size: 13px;
      }

      .command-score {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border-radius: 7px;
        background: var(--accent);
        color: #fffefa;
      }

      .command-score strong {
        font-size: 28px;
      }

      .command-item {
        display: grid;
        gap: 4px;
        padding: 9px;
        border-radius: 7px;
        background: var(--panel-2);
        font-size: 13px;
      }

      .command-item.danger {
        background: var(--red-soft);
        color: var(--urgent);
      }

      .command-item.warning {
        background: var(--amber-soft);
        color: #7c311c;
      }

      .contact-form {
        display: grid;
        gap: 7px;
      }

      @media (max-width: 980px) {
        header {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        main {
          grid-template-columns: 1fr;
        }

        .list {
          order: 1;
        }

        .stack {
          order: 2;
        }

        .detail-panel {
          order: 3;
        }

        .board {
          grid-template-columns: 1fr;
        }

        .toolbar {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .toolbar .search-input {
          grid-column: auto;
          min-width: 0;
        }

        .sourcebar {
          flex-wrap: nowrap;
          max-height: none;
          overflow-x: auto;
          overflow-y: hidden;
        }

        .utilitybar {
          align-items: center;
          flex-direction: row;
        }

        .utility-actions {
          flex: 0 0 auto;
          width: auto;
        }

        .utility-actions button {
          flex: 0 0 auto;
        }

        input,
        select,
        button {
          min-width: 0;
        }
      }

      @media (max-width: 560px) {
        .toolbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toolbar .search-input {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Newsroom Monitor</h1>
      <div class="toolbar">
        <select id="source" multiple hidden aria-hidden="true"></select>
        <select id="status">
          <option value="">전체 상태</option>
          <option value="new">신규</option>
          <option value="watching">확인중</option>
          <option value="ready">방송 후보</option>
          <option value="done">확인완료</option>
          <option value="hold">사용주의</option>
        </select>
        <input id="q" class="search-input" placeholder="검색어" />
        <select id="period">
          <option value="">전체</option>
          <option value="1">24시간</option>
          <option value="3">3일</option>
          <option value="7">7일</option>
          <option value="today">오늘</option>
          <option value="yesterday">어제</option>
          <option value="custom">직접</option>
        </select>
        <select id="mode">
          <option value="latest">최신</option>
          <option value="priority">중요</option>
          <option value="alerts">알림</option>
          <option value="board">보드</option>
          <option value="admin">관리</option>
        </select>
        <button class="primary" id="search">조회</button>
        <button id="collectNow">새로 수집</button>
        <button id="liveSearch">실시간 조회</button>
      </div>
      <div class="quickbar" id="quickbar">
        <button data-category="" class="active">전체</button>
        <button data-category="disaster">재난</button>
        <button data-category="fire">소방</button>
        <button data-category="police">경찰</button>
        <button data-category="weather">기상</button>
        <button data-category="health">보건</button>
        <button data-category="government">정부</button>
        <button data-category="news">뉴스</button>
        <span class="live-status" id="liveStatus">자동 갱신 준비</span>
      </div>
      <div class="presetbar" id="presetbar">
        <button data-query="화재">화재</button>
        <button data-query="침수">침수</button>
        <button data-query="교통사고">교통사고</button>
        <button data-query="실종">실종</button>
        <button data-query="기상특보">기상특보</button>
        <button data-query="감염병">감염병</button>
        <select id="sort">
          <option value="latest">최신순</option>
          <option value="importance">중요도순</option>
          <option value="oldest">오래된순</option>
          <option value="source">출처순</option>
          <option value="ready">방송후보순</option>
        </select>
        <select id="density">
          <option value="normal">보통 보기</option>
          <option value="compact">간단히</option>
          <option value="detail">자세히</option>
        </select>
        <select id="region">
          <option value="">전국</option>
          <option value="capital">수도권</option>
          <option value="gangwon">강원</option>
          <option value="chungcheong">충청</option>
          <option value="honam">호남</option>
          <option value="yeongnam">영남</option>
          <option value="jeju">제주</option>
        </select>
        <input id="dateFrom" type="date" hidden />
        <input id="dateTo" type="date" hidden />
      </div>
      <div class="sourcebar" id="sourcebar"></div>
      <div class="utilitybar">
        <div class="utility-actions">
          <button id="allArticles">전체기사</button>
          <button id="missionMode" class="mission-toggle">속보모드</button>
          <button id="unreadOnly">미확인만</button>
          <button id="riskOnly">보강필요</button>
          <button id="resetFilters">초기화</button>
          <button id="scrollTop">맨 위</button>
        </div>
      </div>
      <div class="filterbar" id="filterChips"></div>
    </header>
    <main>
      <aside class="stack">
        <section class="panel">
          <h2>긴급 상단</h2>
          <div class="side-body urgent-rail" id="urgentRail"></div>
        </section>
        <section class="panel">
          <h2>수집 상태</h2>
          <div class="side-body" id="stats"></div>
        </section>
        <section class="panel">
          <h2>자동 수집기</h2>
          <div class="side-body" id="schedulerStatus"></div>
        </section>
        <section class="panel">
          <h2>출처 경고</h2>
          <div class="side-body" id="sourceWarnings"></div>
        </section>
        <section class="panel">
          <h2>운영</h2>
          <div class="side-body ops-actions">
            <button id="exportCsv">CSV 내보내기</button>
            <button id="exportCue">큐시트 내보내기</button>
            <button id="backupDb">DB 백업</button>
            <button id="rebuildClusters">이슈 재계산</button>
            <button id="pruneAlerts">알림 정리</button>
            <button id="repairData">데이터 정리</button>
            <button id="validateConfig">설정 검사</button>
            <button id="telegramTest">텔레그램 테스트</button>
            <div class="summary ops-status" id="notificationStatus">텔레그램 설정 확인 중</div>
          </div>
        </section>
        <section class="panel">
          <h2>기자 데스크</h2>
          <div class="side-body" id="reporterDesk"></div>
        </section>
        <section class="panel">
          <h2>상세 보강 큐</h2>
          <div class="side-body" id="detailQueue"></div>
        </section>
        <section class="panel">
          <h2>크롤링 지휘센터</h2>
          <div class="side-body" id="commandCenter"></div>
        </section>
        <section class="panel">
          <h2>오보 위험</h2>
          <div class="side-body" id="falseRisk"></div>
        </section>
        <details class="panel">
          <summary>취재 감시망</summary>
          <div class="side-body" id="coverageSnapshot"></div>
        </details>
        <details class="panel">
          <summary>지역 현황</summary>
          <div class="side-body" id="regionStats"></div>
        </details>
        <details class="panel">
          <summary>백업 상태</summary>
          <div class="side-body" id="opsStatus"></div>
        </details>
        <details class="panel">
          <summary>이슈 묶음</summary>
          <div class="side-body" id="clusters"></div>
        </details>
        <details class="panel">
          <summary>알림 로그</summary>
          <div class="side-body">
            <button id="ackAllAlerts">알림 전체 확인</button>
            <div id="alertEvents"></div>
          </div>
        </details>
        <details class="panel">
          <summary>최근 실행</summary>

            <input id="runSearch" placeholder="수집 로그 검색" />
            <select id="runStatus">
              <option value="">전체</option>
              <option value="success">성공</option>
              <option value="failed">실패</option>
              <option value="running">실행중</option>
              <option value="stalled">멈춤 의심</option>
            </select>
            <div id="runs"></div>
          </div>
        </details>
        <details class="panel">
          <summary>출처 품질</summary>
          <div class="side-body" id="sourceQuality"></div>
        </details>
      </aside>
      <section class="list" id="articles"></section>
      <aside class="panel detail-panel">
        <h2>방송 검증</h2>
        <div class="side-body" id="detailPanel">
          <div class="empty">기사를 선택하면 원문 확인, 타사 확인, 관계기관 확인 체크리스트가 표시됩니다.</div>
        </div>
      </aside>
    </main>
    <script>
      const articlesEl = document.querySelector("#articles");
      const runsEl = document.querySelector("#runs");
      const statsEl = document.querySelector("#stats");
      const clustersEl = document.querySelector("#clusters");
      const alertEventsEl = document.querySelector("#alertEvents");
      const detailPanelEl = document.querySelector("#detailPanel");
      const filterChipsEl = document.querySelector("#filterChips");
      const sourceEl = document.querySelector("#source");
      const searchButtonEl = document.querySelector("#search");
      const collectButtonEl = document.querySelector("#collectNow");
      const liveSearchButtonEl = document.querySelector("#liveSearch");
      const urgentRailEl = document.querySelector("#urgentRail");
      const reporterDeskEl = document.querySelector("#reporterDesk");
      const detailQueueEl = document.querySelector("#detailQueue");
      const commandCenterEl = document.querySelector("#commandCenter");
      const falseRiskEl = document.querySelector("#falseRisk");
      const coverageSnapshotEl = document.querySelector("#coverageSnapshot");
      const regionStatsEl = document.querySelector("#regionStats");
      const sourceWarningsEl = document.querySelector("#sourceWarnings");
      const opsStatusEl = document.querySelector("#opsStatus");
      const sourceQualityEl = document.querySelector("#sourceQuality");
      const schedulerStatusEl = document.querySelector("#schedulerStatus");
      const notificationStatusEl = document.querySelector("#notificationStatus");
      const liveStatusEl = document.querySelector("#liveStatus");
      const categoryButtons = Array.from(document.querySelectorAll("#quickbar button"));
      const readKey = "newsroom-read-article-ids";
      const densityKey = "newsroom-card-density";
      const urgentThresholdKey = "newsroom-urgent-threshold-v2";
      const unreadOnlyKey = "newsroom-unread-only";
      const riskOnlyKey = "newsroom-risk-only";
      const missionModeKey = "newsroom-mission-mode";
      const pageSize = 50;
      const defaultFetchTimeoutMs = 45000;
      const crawlFetchTimeoutMs = 900000;
      let activeCategory = "";
      let currentPage = 1;
      let articleLoadToken = 0;
      let detailLoadToken = 0;
      let urgentThreshold = Number(localStorage.getItem(urgentThresholdKey) || 5);
      let unreadOnly = localStorage.getItem(unreadOnlyKey) === "1";
      let riskOnly = localStorage.getItem(riskOnlyKey) === "1";
      let reviewOnly = false;
      let missingAuthorOnly = false;
      let alertOnly = false;
      let bodyOnly = false;
      let detailOnly = false;
      let missionMode = localStorage.getItem(missionModeKey) === "1";
      let toastTimer = undefined;
      let lastArticleCount = undefined;
      let lastUrgentIds = new Set();
      let selectedArticleId = undefined;
      let liveRefreshRunning = false;
      let dashboardRefreshRunning = false;
      let detailQueuePriorityOnly = true;
      let liveSearchTimer = undefined;
      let missionStartedLive = false;
      let crawlProgressTimer = undefined;
      const unreadOnlyEl = document.querySelector("#unreadOnly");
      const riskOnlyEl = document.querySelector("#riskOnly");
      const missionModeEl = document.querySelector("#missionMode");
      const regionEl = document.querySelector("#region");

      document.body.dataset.density = localStorage.getItem(densityKey) || "normal";
      document.querySelector("#density").value = document.body.dataset.density;
      unreadOnlyEl.classList.toggle("active", unreadOnly);
      riskOnlyEl.classList.toggle("active", riskOnly);
      renderMissionMode();

      function showToast(message) {
        let toast = document.querySelector(".toast");
        if (!toast) {

      async function fetchJson(url, options = {}) {
        const { timeoutMs = defaultFetchTimeoutMs, ...fetchOptions } = options;
        let timeoutId = undefined;
        if (timeoutMs && !fetchOptions.signal) {
          const controller = new AbortController();
          fetchOptions.signal = controller.signal;
          timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        }
        let response;
        try {
          response = await fetch(url, fetchOptions);
        } catch (error) {
          if (error.name === "AbortError") {
            throw new Error("요청 시간이 초과됐습니다. 수집 대상이 많으면 출처를 줄이거나 다시 시도하세요.");
          }
          throw new Error(`네트워크 요청 실패: ${error.message || error}`);
        } finally {
          if (timeoutId) clearTimeout(timeoutId);
        }

        const contentType = response.headers.get("content-type") || "";
        const payload = contentType.includes("application/json") ? await response.json().catch(() => null) : await response.text();
        if (!response.ok) {
          throw new Error(formatFetchError(payload, response.status));
        }
        return payload ?? {};
      }

      function formatFetchError(payload, status) {
        const detail = payload && typeof payload === "object" && "detail" in payload ? payload.detail : payload;
        if (Array.isArray(detail)) {
          return detail.map((item) => item.msg || item.message || JSON.stringify(item)).join("\n") || `HTTP ${status}`;
        }
        if (detail && typeof detail === "object") return detail.message || JSON.stringify(detail);
        return String(detail || `HTTP ${status}`);
      }

          .replace(/(^|[^&])apos;/g, "$1'")
          .replace(/(^|[^&])nbsp;/g, "$1 ");
        textarea.innerHTML = normalized;
        return textarea.value;

      async function refreshSourcesBeforeSearch() {
        if (liveRefreshRunning) {
          liveStatusEl.textContent = "수집 중지 요청 중";
          await fetchJson("/crawl/cancel", { method: "POST" });
          showToast("현재 수집을 중지 요청했습니다. 진행 중인 출처 응답 후 멈춥니다.");
          return null;
        }
        liveRefreshRunning = true;
        const originalLabel = collectButtonEl.textContent;
        collectButtonEl.textContent = "중지";
        collectButtonEl.classList.add("danger");
        const startedAt = performance.now();
        const payload = {};
        addSourcePayload(payload);
        if (activeCategory) payload.source_category = activeCategory;
        if (document.querySelector("#q").value.trim()) payload.q = document.querySelector("#q").value.trim();
        liveStatusEl.textContent = "각 출처 접속 중 · 새 기사 확인 중";
        startCrawlProgressPolling();
        try {
          const result = await fetchJson("/crawl/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            timeoutMs: crawlFetchTimeoutMs,
          });
          const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
          const failedText = result.failed_source_count ? ` · 실패 ${result.failed_source_count}곳` : "";
          const emptyText = result.empty_source_count ? ` · 빈 응답 ${result.empty_source_count}곳` : "";
          const notifyText = result.search_match_notification_count ? ` · 알림 ${result.search_match_notification_count}건` : "";
          const fetchedText = Number.isFinite(result.fetched_article_count) ? `, 확인 기사 ${result.fetched_article_count}건` : "";
          const canceledText = result.canceled ? " · 중지됨" : "";
          const failedNames = (result.failed_source_names || []).slice(0, 3).join(", ");
          const emptyNames = (result.empty_source_names || []).slice(0, 3).join(", ");
          const riskNames = failedNames || emptyNames;
          showToast(`실시간 수집 완료: ${result.source_count}곳 확인${fetchedText}, 새 기사 ${result.new_article_count}건 (${seconds}초)${notifyText}${failedText}${emptyText}${canceledText}${riskNames ? ` · 점검 ${riskNames}` : ""}`);
          return result;
        } finally {
          liveRefreshRunning = false;
          collectButtonEl.textContent = originalLabel;
          collectButtonEl.classList.remove("danger");
          stopCrawlProgressPolling();
          Promise.all([loadSchedulerStatus(), loadCoverageOverview(), loadSourceQuality()]).catch((error) => showToast(error.message));
        }
      }

      function formatBytes(value) {

      function formatDurationShort(seconds) {
        const value = Number(seconds);
        if (!Number.isFinite(value) || value < 0) return "기록 없음";
        if (value < 60) return `${Math.max(1, Math.round(value))}초 전`;
        if (value < 3600) return `${Math.round(value / 60)}분 전`;
        if (value < 86400) return `${Math.round(value / 3600)}시간 전`;
        return `${Math.round(value / 86400)}일 전`;

      function formatArticleTime(value) {
        if (!value) return "";
        const text = String(value);
        const hasTimezone = /[zZ]|[+-]\d{2}:\d{2}$/.test(text);
        const normalized = text.includes("T") || hasTimezone ? text : `${text.replace(" ", "T")}Z`;
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) return text.replace("T", " ").replace(/[+-]\d{2}:\d{2}$/, "");
        const parts = new Intl.DateTimeFormat("sv-SE", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).formatToParts(date);
        const byType = Object.fromEntries(parts.map((part) => [part.type, part.value]));
        return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute}:${byType.second}`;
      }

      function playUrgentTone() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const context = new AudioContext();
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = 880;
          gain.gain.setValueAtTime(0.0001, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, context.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.32);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start();
          oscillator.stop(context.currentTime + 0.35);
        } catch {
          return;
        }
      }

      function articleReliabilityView(item) {
        const server = item.reliability && typeof item.reliability === "object" ? item.reliability : null;
        if (server) {
          return {
            score: Number(server.score || 0),
            level: server.level || "warning",
            label: server.label || "추가 확인",
            reasons: Array.isArray(server.reasons) ? server.reasons : [],
            missing: Array.isArray(server.missing) ? server.missing : [],
          };
        }
        const quality = Number(item.quality_score || 0);
        const body = String(item.body_text || item.summary || "");
        const sourceCount = Number(item.cluster_source_count || 0);
        const score = Math.max(
          0,
          Math.min(
            100,
            Math.round(38 + quality * 0.24 + (body.length >= 120 ? 6 : -14) + (item.author ? 7 : -8) + (sourceCount >= 2 ? 10 : -5)),
          ),
        );
        const level = score >= 80 ? "high" : score >= 65 ? "medium" : score >= 45 ? "warning" : "danger";
        const missing = [];
        if (body.length < 120) missing.push("본문");
        if (!item.author && item.source_category === "news" && item.source_type !== "api") missing.push("기자명");
        if (sourceCount < 2 && Number(item.importance_score || 0) >= 4.5) missing.push("복수 출처");
        return {
          score,
          level,
          label: level === "high" ? "방송 안정" : level === "medium" ? "확인 가능" : level === "warning" ? "추가 확인" : "사용 주의",
          reasons: [],
          missing,
        };
      }

      function articleNeedsWork(item) {
        const reliability = articleReliabilityView(item);
        return ["warning", "danger"].includes(reliability.level) || reliability.missing.length > 0;
      }

      function reliabilityStripTemplate(item) {
        const reliability = articleReliabilityView(item);
        const reasons = reliability.reasons.slice(0, 3).join(" · ");
        const missing = reliability.missing.slice(0, 3).join(" · ");
        return `
          <div class="reliability-strip ${escapeHtml(reliability.level)}" title="기사 안정성은 품질, 본문/기자명, 복수 출처, 검증 상태를 합산한 내부 판단입니다.">
            <span class="reliability-badge ${escapeHtml(reliability.level)}">안정 ${Number(reliability.score || 0)} · ${escapeHtml(reliability.label)}</span>
            ${reasons ? `<span class="reliability-detail">근거 ${escapeHtml(reasons)}</span>` : ""}
            ${missing ? `<span class="reliability-detail reliability-missing">보강 ${escapeHtml(missing)}</span>` : ""}
          </div>
        `;
      }

      function articleTemplate(item) {
        const score = Number(item.importance_score || 0);
        const priority = score >= 5 ? "high" : score >= 3 ? "medium" : "normal";
        const read = readIds().has(String(item.id));
        const tags = parseJsonList(item.keywords)
          .slice(0, 8)
          .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
          .join("");
        const regions = parseJsonList(item.region_tags)
          .slice(0, 4)
          .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
          .join("");
        const qualityFlags = parseJsonList(item.quality_flags).slice(0, 3).join(", ");
        const truthFlags = truthSignalTags(item)
          .map((tag) => `<span class="tag warning">${escapeHtml(tag)}</span>`)
          .join("");
        const assist = item.ai_summary
          ? `<div class="assist">${escapeHtml(item.ai_summary)}\n\n${escapeHtml(item.check_points || "")}</div>`
          : "";
        const sourceDistance = sourceDistanceText(item);
        const display = articleDisplayParts(item);
        const timeLabel = item.published_at ? "발행" : "수집";
        const reliability = articleReliabilityView(item);
        return `
          <article data-id="${item.id}" data-priority="${priority}" data-reliability="${escapeHtml(reliability.level)}" class="${read ? "read" : ""} ${String(item.id) === String(selectedArticleId) ? "selected" : ""}">
            <h3><span class="article-label">[제목]</span> <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${highlightSearch(display.title)}</a></h3>
            ${display.body ? `<div class="article-body"><span class="article-label">[기사내용]</span> ${highlightSearch(display.body)}</div>` : ""}
            <div class="meta">
              ${read ? "" : '<span class="status-pill new">NEW</span>'}
              <span>${escapeHtml(item.source_name)}</span>
              ${item.author ? `<span class="author-meta">${escapeHtml(item.author)}</span>` : ""}
              <span class="status-pill category-pill ${escapeHtml(item.source_category || "")}">${escapeHtml(categoryLabel(item.source_category))}</span>
              <span>${timeLabel} ${escapeHtml(formatArticleTime(item.published_at || item.collected_at))}</span>
              <span class="score">score ${score.toFixed(1)}</span>
              <span class="status-pill">품질 ${Number(item.quality_score || 0).toFixed(0)}</span>
              <span class="status-pill ${item.verification_status === "needs_review" ? "review" : ""}">${escapeHtml(verificationLabel(item.verification_status))}</span>
              <span class="status-pill ${item.newsroom_status === "ready" ? "ready" : ""}">${escapeHtml(workflowStatusLabel(item.newsroom_status))}</span>
              <span class="status-pill">${escapeHtml(item.assignee || "담당자 없음")}</span>
            </div>
            ${reliabilityStripTemplate(item)}
            <div class="tags">${tags}${regions}${truthFlags}${qualityFlags ? `<span class="tag">${escapeHtml(qualityFlags)}</span>` : ""}</div>
            <div class="source-distance">${escapeHtml(sourceDistance)}</div>
            <div class="workflow">
              <select data-field="newsroom_status">
                ${statusOption("new", "신규", item.newsroom_status)}
                ${statusOption("watching", "확인중", item.newsroom_status)}
                ${statusOption("ready", "방송 후보", item.newsroom_status)}
                ${statusOption("done", "확인완료", item.newsroom_status)}
                ${statusOption("hold", "사용주의", item.newsroom_status)}
              </select>
              <select data-field="verification_status">
                ${statusOption("unchecked", "미확인", item.verification_status)}
                ${statusOption("needs_review", "확인 필요", item.verification_status)}
                ${statusOption("checking", "확인중", item.verification_status)}
                ${statusOption("verified", "확인완료", item.verification_status)}
                ${statusOption("caution", "사용주의", item.verification_status)}
              </select>
              <input data-field="assignee" placeholder="담당자" value="${escapeHtml(item.assignee || "")}" />
              <button data-action="save">저장</button>
              <button data-action="copy">복사</button>
              <button data-action="telegram">텔레그램</button>
              <button data-action="assist">AI 보조</button>
              <button data-action="enrich">상세 수집</button>
              <button data-action="detail">상세</button>
            </div>
            ${assist}
          </article>
        `;
      }

      function statusOption(value, label, selected) {
        return `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`;
      }

      function workflowStatusLabel(value) {
        return {
          new: "신규",
          watching: "확인중",
          ready: "방송 후보",
          done: "확인완료",
          hold: "사용주의",
        }[value] || value || "상태 없음";
      }

      function verificationLabel(value) {
        return {
          unchecked: "미확인",
          needs_review: "확인 필요",
          checking: "확인중",
          verified: "확인완료",
          caution: "사용주의",
        }[value] || value || "미확인";
      }

      function truthSignalTags(item) {
        const text = `${item.title || ""} ${item.summary || ""} ${item.body_text || ""}`;
        const flags = [];
        if (/(오발송|오발령|훈련상황|훈련 상황|실제상황이 아니|실제 상황이 아니|훈련 메시지)/.test(text)) {
          flags.push("진위주의");
        }
        if (/(상황 종료|수색 종료|진화완료|진화 완료|통제 해제|주의보 해제|경보 해제)/.test(text)) {
          flags.push("상황종료");
        }
        return flags;
      }

      function categoryLabel(value) {
        return {
          disaster: "재난",
          fire: "소방",
          police: "경찰",
          weather: "기상",
          health: "보건",
          government: "정부",
          news: "뉴스",
        }[value] || value || "기타";
      }

      function sourceMatchesLabel(source, label) {
        const aliases = {
          KBS: ["kbs"],
          SBS: ["sbs"],
          MBC: ["mbc"],
          YTN: ["ytn"],
          JTBC: ["jtbc"],
          TV조선: ["tv chosun"],
          채널A: ["channel a"],
          MBN: ["mbn"],
          KNN: ["knn"],
          KBC: ["kbc", "ikbc"],
          TBC: ["tbc"],
          TJB: ["tjb"],
          JTV: ["jtv"],
          G1: ["g1"],
          UBC: ["ubc"],
          CJB: ["cjb"],
          JIBS: ["jibs"],
          연합뉴스TV: ["yonhap news tv"],
          조선: ["chosun"],
          동아: ["donga"],
          경향: ["kyunghyang"],
          한겨레: ["hankyoreh"],
          한경: ["hankyung"],
          매경: ["maeil business"],
          머니투데이: ["moneytoday"],
          세계: ["segye"],
          오마이: ["ohmynews"],
          뉴시스: ["newsis"],
          이투데이: ["etoday"],
          프레시안: ["pressian"],
          경찰: ["police"],
          소방: ["fire"],
          기상: ["weather"],
          정부: ["government"],
        };
        const name = String(source.name || "").toLowerCase();
        const category = String(source.source_category || "").toLowerCase();
        return (aliases[label] || [label]).some((alias) => name.includes(alias.toLowerCase()) || category === alias.toLowerCase());
      }

      function articleDisplayParts(item) {
        const title = decodeHtmlEntities(item.title || "");
        const summary = decodeHtmlEntities(item.summary || "");
        if (summary) {
          return { title, body: summary };
        }
        if (item.source_name !== "KBS Disaster Portal") {
          return splitLongTitle(title);
        }
        const cleaned = title.replace(/\s+\d{4}\.\d{2}\.\d{2}\s+\(\d{2}:\d{2}\)\s*$/, "");
        const markers = [" KBSLIFE", " [안전토크]", " 이와 관련", " 고령 운전자의", " 일본 지진의"];
        const splitAt = markers
          .map((marker) => cleaned.indexOf(marker))
          .filter((index) => index > 18)
          .sort((a, b) => a - b)[0];
        if (!splitAt) return { title, body: "" };
        return {
          title: cleaned.slice(0, splitAt).trim(),
          body: cleaned.slice(splitAt).trim(),
        };
      }

      function splitLongTitle(title) {
        const text = String(title || "").trim();
        if (text.length < 120) return { title: text, body: "" };
        const markerIndexes = [
          " [앵커]",
          " [기자]",
          " ◇ ",
          " ◆ ",
          " 특파원 ",
          " 기자 ",
          " 기자의 보도",
          " 이재명 대통령",
          " 그런데 ",
          " 전북과 ",
          " [ SYNC ]",
          "CNN 방송",
          "선박 소유사",
          "회사 측",
          "또 ",
          "앞서 ",
        ]
          .map((marker) => text.indexOf(marker))
          .filter((index) => index > 12 && index <= 180);
        const markerIndex = markerIndexes.sort((a, b) => a - b)[0];
        if (markerIndex) {
          return { title: text.slice(0, markerIndex).trim(), body: text.slice(markerIndex).trim() };
        }
        const sentence = text.match(/^.{35,120}?(?:[.!?]|[다요죠음임까다]\.)\s+/);
        if (sentence) {
          const splitAt = sentence[0].length;
          return { title: text.slice(0, splitAt).trim(), body: text.slice(splitAt).trim() };
        }
        const splitAt = text.lastIndexOf(" ", 100);
        if (splitAt > 35) return { title: text.slice(0, splitAt).trim(), body: text.slice(splitAt).trim() };
        return { title: text, body: "" };
      }

      function sourceDistanceText(item) {
        const sourceCount = Number(item.cluster_source_count || 0);
        const articleCount = Number(item.cluster_article_count || 0);
        if (sourceCount > 1) {
          return `출처 간 거리: 같은 이슈가 ${sourceCount}개 출처, ${articleCount}건에서 확인됨`;
        }
        return "출처 간 거리: 단일 출처 이슈";
      }

      async function loadArticles(options = {}) {
        const requestToken = ++articleLoadToken;
        setArticleLoading(true);
        try {
          if (options.allArticles) resetFilters();
          if (options.page) currentPage = options.page;
          if (options.resetPage) currentPage = 1;
          const q = document.querySelector("#q").value.trim();
          const mode = document.querySelector("#mode").value;
          const source = selectedSourceLabel();
          const status = document.querySelector("#status").value;
          const sort = document.querySelector("#sort").value;
          const region = regionEl.value;
          const offset = (currentPage - 1) * pageSize;
          const params = new URLSearchParams({ limit: String(pageSize), offset: String(offset) });
          if (mode === "admin") {
            await loadAdmin();
            return;
          }
          if (mode === "board") {
            await loadBoard();
            return;
          }
          if (options.refreshFirst) {
            await refreshSourcesBeforeSearch();
            if (requestToken !== articleLoadToken) return;
          }
          if (q) params.set("q", q);
          appendSourceParams(params);
          if (status) params.set("newsroom_status", status);
          if (activeCategory) params.set("source_category", activeCategory);
          if (riskOnly && mode === "latest") params.set("needs_work", "true");
          if (reviewOnly && mode === "latest") params.set("needs_review", "true");
          if (missingAuthorOnly && mode === "latest") params.set("missing_author", "true");
          if (alertOnly && mode === "latest") params.set("has_alert", "true");
          if (bodyOnly && mode === "latest") params.set("has_body", "true");
          if (detailOnly && mode === "latest") params.set("needs_detail", "true");
          if (sort) params.set("sort", sort);
          addDateFilters(params);
          addRegionFilter(params);
          const modeParams = new URLSearchParams({ limit: "50" });
          appendSourceParams(modeParams);
          if (activeCategory) modeParams.set("source_category", activeCategory);
          addRegionFilter(modeParams);
          const url =
            mode === "priority"
              ? `/priority?${modeParams.toString()}`
              : mode === "alerts"
                ? `/alerts?${modeParams.toString()}`
                : `/articles?${params.toString()}`;
          const items = await fetchJson(url);
          if (requestToken !== articleLoadToken) return;
          let countInfo = null;
          if (mode === "latest") {
            const countParams = new URLSearchParams(params);
            countParams.delete("limit");
            try {
              countInfo = await fetchJson(`/articles/count?${countParams.toString()}`);
            } catch {
              countInfo = null;
            }
            if (requestToken !== articleLoadToken) return;
          }
          const totalCount = countInfo?.count ?? items.length;
          const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
          if (currentPage > totalPages) {
            currentPage = totalPages;
            return loadArticles({ page: currentPage });
          }
          let visibleItems = unreadOnly ? items.filter((item) => !readIds().has(String(item.id))) : items;
          if (riskOnly && mode !== "latest") visibleItems = visibleItems.filter(articleNeedsWork);
          articlesEl.innerHTML = visibleItems.length
            ? visibleItems.map(articleTemplate).join("")
            : '<div class="empty">표시할 기사가 없습니다.</div>';
          if (mode === "latest" && totalPages > 1) {
            articlesEl.insertAdjacentHTML("beforeend", paginationTemplate(currentPage, totalPages));
          }
          const unread = items.filter((item) => !readIds().has(String(item.id))).length;
          const needsWork = riskOnly && mode === "latest" ? totalCount : items.filter(articleNeedsWork).length;
          if (lastArticleCount !== undefined && items.length > lastArticleCount) {
            showToast(`새 기사 ${items.length - lastArticleCount}건이 목록에 표시됐습니다.`);
          }
          lastArticleCount = items.length;
          const statLabel = activeStatLabel(status);
          const resultLabel = statLabel || (q || source || status || activeCategory || region ? "검색 결과" : "목록");
          const start = items.length ? offset + 1 : 0;
          const end = offset + items.length;
          const resultCount = countInfo ? `${start}-${end}/${countInfo.count}건` : `${items.length}건`;
          const unreadText = unreadOnly ? `미확인 표시 ${visibleItems.length}/${items.length}건` : `미확인 ${unread}건`;
          const workText = activeStatBasisText() || ` · 현재 페이지 보강필요 ${needsWork}건`;
          const regionText = region ? ` · ${selectedRegionLabel()}` : "";
          liveStatusEl.textContent = `${resultLabel} ${resultCount}${regionText} · ${unreadText}${workText} · ${new Date().toLocaleTimeString("ko-KR")}`;
          renderFilterChips();
        } finally {
          if (requestToken === articleLoadToken) setArticleLoading(false);
        }
      }

      function paginationTemplate(page, totalPages) {
        const pages = visiblePages(page, totalPages);
        return `
          <nav class="pagination" aria-label="기사 페이지">
            <button data-page="${Math.max(1, page - 1)}" ${page === 1 ? "disabled" : ""}>이전</button>
            ${pages
              .map((item) =>
                item === "..."
                  ? "<span>...</span>"
                  : `<button data-page="${item}" class="${item === page ? "active" : ""}">${item}</button>`,
              )
              .join("")}
            <button data-page="${Math.min(totalPages, page + 1)}" ${page === totalPages ? "disabled" : ""}>다음</button>
          </nav>
        `;
      }

      function visiblePages(page, totalPages) {
        const pages = new Set([1, totalPages, page, page - 1, page + 1]);
        if (page <= 3) [2, 3, 4].forEach((item) => pages.add(item));
        if (page >= totalPages - 2) [totalPages - 3, totalPages - 2, totalPages - 1].forEach((item) => pages.add(item));
        const sorted = Array.from(pages)
          .filter((item) => item >= 1 && item <= totalPages)
          .sort((a, b) => a - b);
        return sorted.flatMap((item, index) => (index && item - sorted[index - 1] > 1 ? ["...", item] : [item]));
      }

      async function loadBoard() {
        const statuses = [
          ["new", "신규"],
          ["watching", "확인중"],
          ["ready", "방송 후보"],

        const columns = await Promise.all(
          statuses.map(async ([value, label]) => {
            const params = new URLSearchParams({ limit: "20", newsroom_status: value });
            if (activeCategory) params.set("source_category", activeCategory);
            addDateFilters(params);
            addRegionFilter(params);
            const items = await fetchJson(`/articles?${params.toString()}`);
            return { value, label, items };

        articlesEl.innerHTML = `

            ${columns
              .map(

        liveStatusEl.textContent = `보드 갱신 · ${new Date().toLocaleTimeString("ko-KR")}`;

      async function saveWorkflow(article) {
        const id = article.dataset.id;
        const payload = {};
        article.querySelectorAll("[data-field]").forEach((field) => {
          payload[field.dataset.field] = field.value;
        });
        await fetchJson(`/articles/${id}/workflow`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        await loadArticles();
        await loadStats();
      }

        const id = article.dataset.id;
        await fetchJson(`/articles/${id}/ai-assist`, { method: "POST" });
        await loadArticles();
      }

      async function enrichArticle(article) {
        const id = article.dataset.id;
        await fetchJson(`/articles/${id}/enrich`, { method: "POST", timeoutMs: 90000 });
        await loadArticles();
        await showDetail(id);

      async function showDetail(id) {
        const detailToken = ++detailLoadToken;
        selectedArticleId = id;
        document.querySelectorAll("article.selected").forEach((article) => article.classList.remove("selected"));
        articlesEl.querySelector(`article[data-id="${CSS.escape(String(id))}"]`)?.classList.add("selected");
        detailPanelEl.setAttribute("aria-busy", "true");
        detailPanelEl.innerHTML = '<div class="empty">상세 정보 불러오는 중...</div>';
        try {
        const [item, advice, contactLogs] = await Promise.all([
          fetchJson(`/articles/${id}`),
          fetchJson(`/reporter/articles/${id}/advice`),
          fetchJson(`/articles/${id}/contact-logs`),
        ]);
        if (detailToken !== detailLoadToken) return;
        markRead(id);
        const images = parseJsonList(item.image_urls).slice(0, 4);
        const videos = parseJsonList(item.video_urls).slice(0, 4);
        const regions = parseJsonList(item.region_tags);

      async function loadUrgentRail() {
        const params = new URLSearchParams({
          limit: "8",
          threshold: String(urgentThreshold),
          strict_urgent: "true",
          collected_within_hours: "24",
        });
        appendSourceParams(params);
        if (activeCategory) params.set("source_category", activeCategory);
        addRegionFilter(params);
        const items = await fetchJson(`/alerts?${params.toString()}`);
        const visibleItems = items.slice(0, 3);
        const currentIds = new Set(items.map((item) => String(item.id)));
        const hasNewUrgent = [...currentIds].some((id) => !lastUrgentIds.has(id));
        urgentRailEl.innerHTML = `
          ${urgentSummaryTemplate(items)}
          ${
            visibleItems.length
              ? visibleItems.map(urgentItemTemplate).join("")
              : '<div class="empty">긴급 후보가 없습니다.</div>'
          }
        `;
        if (lastUrgentIds.size && hasNewUrgent) {
          playUrgentTone();
          showToast("새 긴급 후보가 들어왔습니다.");
        }
        lastUrgentIds = currentIds;
      }

        const sourceCount = new Set(items.map((item) => item.source_name)).size;
        return `

      function urgentItemTemplate(item) {
        const severity = urgentSeverity(item);

          <div class="urgent-item ${severity.level} ${lastUrgentIds.has(String(item.id)) ? "" : "flash"}" data-id="${item.id}">

      function urgentSeverity(item) {
        const score = Number(item.importance_score || 0);
        if (score >= 6.5) return { level: "critical", label: "즉시" };
        if (score >= 5) return { level: "high", label: "주의" };
        return { level: "watch", label: "관찰" };
      }

      function urgentReasons(item) {
        const reasons = [];
        const keywords = parseJsonList(item.keywords).slice(0, 3);
        if (keywords.length) reasons.push(`키워드 ${keywords.join(", ")}`);
        if (Number(item.cluster_source_count || 0) > 1) reasons.push(`교차 ${item.cluster_source_count}개 출처`);
        if (item.verification_status === "needs_review") reasons.push("검증 필요");
        if (["disaster", "fire", "police", "weather", "health"].includes(item.source_category)) reasons.push(categoryLabel(item.source_category));
        if (!reasons.length) reasons.push("중요도 상위");
        return reasons;
      }

      function compactText(value, max = 90) {
        const text = decodeHtmlEntities(value || "").replace(/\s+/g, " ").trim();
        if (text.length <= max) return text;
        const cut = text.lastIndexOf(" ", max);
        return `${text.slice(0, cut > 30 ? cut : max).trim()}...`;
      }

      function reporterDeskTitle(item) {
        const display = articleDisplayParts(item);
        return compactText(display.title || item.cuesheet?.headline || item.title, 82);
      }

      function reporterDeskBrief(item) {
        const display = articleDisplayParts(item);
        const brief = display.body || item.cuesheet?.verification_gap || item.cuesheet?.contact_hint || "";
        return compactText(brief, 120);
      }

      function reporterDeskChips(item) {
        const chips = [];
        if (item.verification_risk) chips.push(`검증 ${item.verification_risk}`);
        if (item.cuesheet?.region) chips.push(item.cuesheet.region);
        for (const reason of item.reasons || []) {
          if (chips.length >= 5) break;
          chips.push(reason);
        }
        return chips;
      }

      function renderSchedulerStatus(status) {
        const last = status.last_run;
        const stalled = Number(status.stalled_count || 0);
        const running = Number(status.running_count || 0);
        const level = stalled ? "danger" : running ? "warning" : status.failed_24h ? "warning" : "";
        const progress = status.progress || {};
        const total = Number(progress.total || 0);
        const index = Number(progress.index || 0);
        const percent = total ? Math.min(100, Math.round((index / total) * 100)) : 0;
        const progressText =
          progress.status === "running" && total

                  return `

                },
              )
              .join("")

                <div class="source-warning-head">

                </div>
                <div class="summary">대부분의 출처가 같은 시점 이후 멈춰 있습니다. 개별 언론사 장애보다 실시간 조회나 자동 수집기 실행 여부를 먼저 확인하세요.</div>
              </div>`
            : "";
        sourceWarningsEl.innerHTML = `${failureDiagnosticsTemplate(diagnostics)}${warningHtml || ""}`;
        sourceQualityEl.innerHTML = quality
          .slice(0, 12)
          .map((source) => {
            const rate = source.success_rate === null ? "-" : `${source.success_rate}%`;
            const fetched = Number.isFinite(Number(source.last_fetched_article_count))
              ? Number(source.last_fetched_article_count)
              : 0;
            const lag = formatDurationShort(source.seconds_since_last_run);
            const rowClass =
              source.risk_level === "danger"
                ? "quality-row failed"
                : source.risk_level === "warning"
                  ? "quality-row warning"
                  : "quality-row";
            return `
              <div class="${rowClass}">
                <strong>${escapeHtml(source.name)}</strong>
                <span>${rate}</span>
                <span>${escapeHtml(categoryLabel(source.source_category))} · 누적 ${source.article_count} · 확인 ${fetched}</span>
