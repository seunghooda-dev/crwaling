<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Newsroom Monitor</title>
    <style>
      :root {
        color-scheme: light;
        --stone: #e5e3d7;
        --wine: #6d1a36;
        --green: #33673b;
        --signal: #e4572e;
        --navy: #083d77;
        --bg: #eef0ea;
        --panel: #fffefa;
        --panel-2: #f7f7f1;
        --ink: #172231;
        --muted: #607080;
        --line: #d7d8cf;
        --line-strong: #9ea8a1;
        --accent: #083d77;
        --accent-ink: #062a52;
        --urgent: #6d1a36;
        --warn: #e4572e;
        --success: #33673b;
        --soft: #e7eef6;
        --amber-soft: #fde8de;
        --red-soft: #f2dbe3;
        --green-soft: #e3efe5;
        --shadow: 0 1px 2px rgba(8, 61, 119, 0.06), 0 12px 30px rgba(8, 61, 119, 0.08);
        --shadow-soft: 0 1px 3px rgba(8, 61, 119, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(180deg, rgba(8, 61, 119, 0.1), rgba(229, 227, 215, 0) 240px),
          var(--bg);
        color: var(--ink);
        font-family: Arial, "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 254, 250, 0.94);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0;
      }

      h1::after {
        content: "LIVE";
        display: inline-flex;
        margin-left: 10px;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--wine);
        color: #fffefa;
        font-size: 11px;
        vertical-align: middle;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(150px, 190px) minmax(120px, 145px) minmax(220px, 280px) minmax(105px, 125px) minmax(95px, 115px) minmax(90px, 105px) minmax(110px, 130px);
        gap: 8px;
        align-items: center;
        justify-content: stretch;
      }

      .toolbar input,
      .toolbar select,
      .toolbar button {
        width: 100%;
        min-width: 0;
      }

      .toolbar .search-input {
        min-width: 220px;
      }

      .quickbar {
        grid-column: 1 / -1;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }

      .quickbar button {
        height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(255, 254, 250, 0.84);
        color: #334455;
        font-size: 12px;
      }

      .quickbar button.active {
        border-color: var(--accent);
        background: var(--navy);
        color: #fffefa;
      }

      .live-status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }

      .presetbar {
        grid-column: 1 / -1;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }

      .presetbar button {
        height: 28px;
        padding: 0 9px;
        border-color: rgba(8, 61, 119, 0.18);
        background: var(--soft);
        color: var(--accent-ink);
        font-size: 12px;
      }

      .presetbar select,
      .presetbar input {
        width: auto;
        height: 28px;
        font-size: 12px;
      }

      .presetbar input[type="date"] {
        min-width: 132px;
      }

      .sourcebar {
        grid-column: 1 / -1;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }

      .sourcebar button {
        height: 28px;
        padding: 0 9px;
        border-color: rgba(51, 103, 59, 0.18);
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
      }

      .sourcebar button.active {
        border-color: var(--green);
        background: var(--green);
        color: #fffefa;
      }

      input,
      select,
      textarea,
      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
      }

      input,
      select,
      button {
        height: 38px;
      }

      input {
        width: min(300px, 40vw);
        padding: 0 10px;
      }

      select {
        padding: 0 8px;
      }

      textarea {
        min-height: 72px;
        padding: 8px;
        resize: vertical;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 600;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease, transform 120ms ease;
      }

      button:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-soft);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      button.live-active {
        border-color: var(--urgent);
        background: var(--urgent);
        color: #fffefa;
      }

      button.danger {
        border-color: var(--urgent);
        color: var(--urgent);
      }

      main {
        display: grid;
        grid-template-columns: 300px minmax(440px, 1fr) 360px;
        gap: 14px;
        padding: 14px;
      }

      .panel,
      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow-soft);
      }

      .panel {
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 13px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        background: linear-gradient(90deg, #f7f7f1, #edf2f7);
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .side-body {
        display: grid;
        gap: 8px;
        padding: 12px;
      }

      .side-body > input,
      .side-body > select,
      .side-body > button {
        width: 100%;
        min-width: 0;
      }

      .run-filter {
        gap: 8px;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        background: #eef4ef;
        border-radius: 6px;
        font-size: 14px;
        color: #244a2b;
      }

      .stat.warning {
        background: var(--amber-soft);
        color: #8f331c;
      }

      .stat.danger {
        background: var(--red-soft);
        color: var(--wine);
      }

      .crawl-progress {
        display: grid;
        gap: 6px;
        padding: 10px;
        border-radius: 6px;
        background: var(--soft);
        color: var(--accent-ink);
        font-size: 13px;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(8, 61, 119, 0.14);
      }

      .progress-bar {
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 160ms ease;
      }

      .run,
      .cluster {
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        font-size: 13px;
        line-height: 1.45;
      }

      .failed {
        color: var(--warn);
      }

      .list {
        display: grid;
        gap: 10px;
        align-content: start;
        align-items: start;
        min-width: 0;
      }

      .list.loading {
        opacity: 0.72;
        transition: opacity 120ms ease;
      }

      .pagination {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
      }

      .pagination button {
        width: auto;
        min-width: 34px;
        height: 32px;
        padding: 0 10px;
      }

      .pagination button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .pagination span {
        color: var(--muted);
        font-size: 13px;
      }

      .detail-panel {
        position: sticky;
        top: 16px;
        align-self: start;
        max-height: calc(100vh - 32px);
        overflow: auto;
        min-width: 0;
      }

      article {
        display: grid;
        gap: 6px;
        align-content: start;
        align-self: start;
        padding: 12px 14px;
        border-left: 4px solid transparent;
        height: fit-content;
        min-width: 0;
      }

      article.read {
        opacity: 0.68;
      }

      article.selected {
        border-color: rgba(8, 61, 119, 0.35);
        box-shadow: 0 0 0 2px rgba(8, 61, 119, 0.08), var(--shadow-soft);
      }

      article[data-priority="high"] {
        border-left-color: var(--urgent);
      }

      article[data-priority="medium"] {
        border-left-color: var(--warn);
      }

      article h3 {
        margin: 0;
        font-size: 17px;
        line-height: 1.28;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      article a {
        color: inherit;
        text-decoration: none;
      }

      article a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .article-label {
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 800;
      }

      .article-body {
        color: #3f4b58;
        font-size: 13px;
        line-height: 1.42;
        overflow-wrap: anywhere;
        align-self: start;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 5;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      mark {
        border-radius: 3px;
        background: #fde8de;
        color: var(--ink);
        padding: 0 2px;
      }

      .meta,
      .tags,
      .actions,
      .workflow {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        min-width: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .tag {
        padding: 4px 7px;
        border-radius: 999px;
        background: var(--stone);
        color: #314052;
        font-size: 12px;
      }

      .score {
        color: var(--urgent);
        font-weight: 700;
      }

      .workflow select,
      .workflow input {
        width: 150px;
      }

      .source-distance {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .assist {
        white-space: pre-wrap;
        border-left: 3px solid var(--accent);
        padding: 10px 12px;
        background: var(--soft);
        color: #17324e;
        font-size: 13px;
        line-height: 1.5;
      }

      .summary {
        color: #3f4b58;
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .summary a,
      .detail-panel strong {
        overflow-wrap: anywhere;
      }

      .detail-panel .stack {
        min-width: 0;
      }

      .empty {
        padding: 20px;
        color: var(--muted);
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        color: var(--ink);
        font-size: 14px;
        z-index: 50;
      }

      .status-pill {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--stone);
        color: #34404e;
      }

      .status-pill.review {
        background: var(--amber-soft);
        color: var(--warn);
      }

      .status-pill.ready {
        background: var(--green-soft);
        color: var(--success);
      }

      .status-pill.new {
        background: var(--wine);
        color: #fffefa;
      }

      .category-pill {
        border: 1px solid rgba(8, 61, 119, 0.16);
        background: #eef4fb;
        color: var(--accent-ink);
      }

      .category-pill.disaster,
      .category-pill.weather {
        border-color: rgba(228, 87, 46, 0.28);
        background: #fde8de;
        color: #8f331c;
      }

      .category-pill.fire,
      .category-pill.police {
        border-color: rgba(109, 26, 54, 0.25);
        background: #f2dbe3;
        color: var(--wine);
      }

      .category-pill.government,
      .category-pill.health {
        border-color: rgba(51, 103, 59, 0.28);
        background: #e3efe5;
        color: var(--green);
      }

      .urgent-rail {
        display: grid;
        gap: 8px;
      }

      .urgent-item {
        padding: 10px;
        border: 1px solid rgba(109, 26, 54, 0.22);
        border-left: 4px solid var(--wine);
        border-radius: 8px;
        background: #fff8f9;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.45;
      }

      .urgent-item.flash {
        animation: flashUrgent 900ms ease-in-out 2;
      }

      @keyframes flashUrgent {
        0%,
        100% {
          background: #fff8f9;
        }
        50% {
          background: #f2dbe3;
        }
      }

      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(180px, 1fr));
        gap: 10px;
        align-items: start;
      }

      .board-column {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .board-column h3 {
        margin: 0;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
        font-size: 14px;
      }

      .board-card {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        line-height: 1.45;
      }

      .quality-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        font-size: 13px;
        line-height: 1.45;
      }

      .quality-row strong {
        min-width: 0;
      }

      .quality-row.warning {
        color: #8f331c;
      }

      body[data-density="compact"] article {
        gap: 4px;
        padding: 9px 11px;
      }

      body[data-density="compact"] article h3 {
        font-size: 15px;
      }

      body[data-density="compact"] .article-body,
      body[data-density="compact"] .workflow,
      body[data-density="compact"] .actions {
        display: none;
      }

      body[data-density="detail"] article {
        gap: 8px;
      }

      .compare-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .checklist {
        display: grid;
        gap: 6px;
      }

      .checklist label {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 13px;
      }

      .checklist input[type="checkbox"] {
        width: 16px;
        height: 16px;
        min-width: 16px;
        flex: 0 0 16px;
        margin: 0;
        accent-color: var(--accent);
      }

      .verification-brief {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8faf4;
      }

      .verification-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .verification-actions a,
      .verification-actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fffefa;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .verification-actions a.primary-link {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffefa;
      }

      .evidence-list {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }

        .board {
          grid-template-columns: 1fr;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        input,
        select,
        button {
          flex: 1 1 150px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Newsroom Monitor</h1>
      <div class="toolbar">
        <select id="source"></select>
        <select id="status">
          <option value="">전체 상태</option>
          <option value="new">신규</option>
          <option value="watching">확인중</option>
          <option value="ready">방송 후보</option>
          <option value="done">확인완료</option>
          <option value="hold">사용주의</option>
        </select>
        <input id="q" class="search-input" placeholder="검색어" />
        <select id="period">
          <option value="">전체</option>
          <option value="1">24시간</option>
          <option value="3">3일</option>
          <option value="7">7일</option>
          <option value="today">오늘</option>
          <option value="yesterday">어제</option>
          <option value="custom">직접</option>
        </select>
        <select id="mode">
          <option value="latest">최신</option>
          <option value="priority">중요</option>
          <option value="alerts">알림</option>
          <option value="board">보드</option>
          <option value="admin">관리</option>
        </select>
        <button class="primary" id="search">조회</button>
        <button id="liveSearch">실시간 조회</button>
      </div>
      <div class="quickbar" id="quickbar">
        <button data-category="" class="active">전체</button>
        <button data-category="disaster">재난</button>
        <button data-category="fire">소방</button>
        <button data-category="police">경찰</button>
        <button data-category="weather">기상</button>
        <button data-category="health">보건</button>
        <button data-category="government">정부</button>
        <button data-category="news">뉴스</button>
        <span class="live-status" id="liveStatus">자동 갱신 준비</span>
      </div>
      <div class="presetbar" id="presetbar">
        <button data-query="화재">화재</button>
        <button data-query="침수">침수</button>
        <button data-query="교통사고">교통사고</button>
        <button data-query="실종">실종</button>
        <button data-query="기상특보">기상특보</button>
        <button data-query="감염병">감염병</button>
        <select id="sort">
          <option value="importance">중요도순</option>
          <option value="latest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="source">출처순</option>
          <option value="ready">방송후보순</option>
        </select>
        <select id="density">
          <option value="normal">보통 보기</option>
          <option value="compact">간단히</option>
          <option value="detail">자세히</option>
        </select>
        <input id="dateFrom" type="date" hidden />
        <input id="dateTo" type="date" hidden />
      </div>
      <div class="sourcebar" id="sourcebar"></div>
    </header>
    <main>
      <aside class="stack">
        <section class="panel">
          <h2>긴급 상단</h2>
          <div class="side-body urgent-rail" id="urgentRail"></div>
        </section>
        <section class="panel">
          <h2>수집 상태</h2>
          <div class="side-body" id="stats"></div>
        </section>
        <section class="panel">
          <h2>자동 수집기</h2>
          <div class="side-body" id="schedulerStatus"></div>
        </section>
        <section class="panel">
          <h2>출처 경고</h2>
          <div class="side-body" id="sourceWarnings"></div>
        </section>
        <section class="panel">
          <h2>운영</h2>
          <div class="side-body">
            <button id="exportCsv">CSV 내보내기</button>
            <button id="exportCue">큐시트 내보내기</button>
            <button id="backupDb">DB 백업</button>
            <button id="rebuildClusters">이슈 재계산</button>
            <button id="pruneAlerts">오래된 알림 정리</button>
            <button id="validateConfig">설정 검사</button>
          </div>
        </section>
        <section class="panel">
          <h2>백업 상태</h2>
          <div class="side-body" id="opsStatus"></div>
        </section>
        <section class="panel">
          <h2>이슈 묶음</h2>
          <div class="side-body" id="clusters"></div>
        </section>
        <section class="panel">
          <h2>알림 로그</h2>
          <div class="side-body">
            <button id="ackAllAlerts">알림 전체 확인</button>
            <div id="alertEvents"></div>
          </div>
        </section>
        <section class="panel">
          <h2>최근 실행</h2>
          <div class="side-body run-filter">
            <input id="runSearch" placeholder="수집 로그 검색" />
            <select id="runStatus">
              <option value="">전체</option>
              <option value="success">성공</option>
              <option value="failed">실패</option>
              <option value="running">실행중</option>
            </select>
            <div id="runs"></div>
          </div>
        </section>
        <section class="panel">
          <h2>출처 품질</h2>
          <div class="side-body" id="sourceQuality"></div>
        </section>
      </aside>
      <section class="list" id="articles"></section>
      <aside class="panel detail-panel">
        <h2>방송 검증</h2>
        <div class="side-body" id="detailPanel">
          <div class="empty">기사를 선택하면 원문 확인, 타사 확인, 관계기관 확인 체크리스트가 표시됩니다.</div>
        </div>
      </aside>
    </main>
    <script>
      const articlesEl = document.querySelector("#articles");
      const runsEl = document.querySelector("#runs");
      const statsEl = document.querySelector("#stats");
      const clustersEl = document.querySelector("#clusters");
      const alertEventsEl = document.querySelector("#alertEvents");
      const detailPanelEl = document.querySelector("#detailPanel");
      const sourceEl = document.querySelector("#source");
      const searchButtonEl = document.querySelector("#search");
      const liveSearchButtonEl = document.querySelector("#liveSearch");
      const urgentRailEl = document.querySelector("#urgentRail");
      const sourceWarningsEl = document.querySelector("#sourceWarnings");
      const opsStatusEl = document.querySelector("#opsStatus");
      const sourceQualityEl = document.querySelector("#sourceQuality");
      const schedulerStatusEl = document.querySelector("#schedulerStatus");
      const liveStatusEl = document.querySelector("#liveStatus");
      const categoryButtons = Array.from(document.querySelectorAll("#quickbar button"));
      const readKey = "newsroom-read-article-ids";
      const densityKey = "newsroom-card-density";
      const pageSize = 50;
      let activeCategory = "";
      let currentPage = 1;
      let articleLoadToken = 0;
      let toastTimer = undefined;
      let lastArticleCount = undefined;
      let lastUrgentIds = new Set();
      let selectedArticleId = undefined;
      let liveRefreshRunning = false;
      let liveSearchTimer = undefined;
      let crawlProgressTimer = undefined;

      document.body.dataset.density = localStorage.getItem(densityKey) || "normal";
      document.querySelector("#density").value = document.body.dataset.density;

      function showToast(message) {
        let toast = document.querySelector(".toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.className = "toast";
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.remove(), 4200);
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `HTTP ${response.status}`);
        }
        return response.json();
      }

      function setArticleLoading(active) {
        articlesEl.classList.toggle("loading", active);
        articlesEl.setAttribute("aria-busy", active ? "true" : "false");
      }

      function decodeHtmlEntities(value) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = String(value ?? "");
        return textarea.value;
      }

      async function refreshSourcesBeforeSearch() {
        if (liveRefreshRunning) {
          liveStatusEl.textContent = "수집 중지 요청 중";
          await fetchJson("/crawl/cancel", { method: "POST" });
          showToast("현재 수집을 중지 요청했습니다. 진행 중인 출처 응답 후 멈춥니다.");
          return null;
        }
        liveRefreshRunning = true;
        const originalLabel = searchButtonEl.textContent;
        searchButtonEl.textContent = "중지";
        const startedAt = performance.now();
        const payload = {};
        if (sourceEl.value) payload.source_name = sourceEl.value;
        if (activeCategory) payload.source_category = activeCategory;
        if (document.querySelector("#q").value.trim()) payload.q = document.querySelector("#q").value.trim();
        liveStatusEl.textContent = "각 출처 접속 중 · 새 기사 확인 중";
        startCrawlProgressPolling();
        try {
          const result = await fetchJson("/crawl/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
          const failedText = result.failed_source_count ? ` · 실패 ${result.failed_source_count}곳` : "";
          const notifyText = result.search_match_notification_count ? ` · 알림 ${result.search_match_notification_count}건` : "";
          const fetchedText = Number.isFinite(result.fetched_article_count) ? `, 확인 기사 ${result.fetched_article_count}건` : "";
          const canceledText = result.canceled ? " · 중지됨" : "";
          showToast(`실시간 수집 완료: ${result.source_count}곳 확인${fetchedText}, 새 기사 ${result.new_article_count}건 (${seconds}초)${notifyText}${failedText}${canceledText}`);
          return result;
        } finally {
          liveRefreshRunning = false;
          searchButtonEl.textContent = originalLabel;
          stopCrawlProgressPolling();
          loadSchedulerStatus().catch((error) => showToast(error.message));
        }
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function highlightSearch(value) {
        const escaped = escapeHtml(value);
        const q = document.querySelector("#q").value.trim();
        if (!q) return escaped;
        const terms = q
          .split(/\s+/)
          .map((term) => term.trim())
          .filter((term) => term.length > 1)
          .slice(0, 5);
        if (!terms.length) return escaped;
        return escaped.replace(new RegExp(`(${terms.map(escapeRegExp).join("|")})`, "gi"), "<mark>$1</mark>");
      }

      function parseJsonList(value) {
        if (!value) return [];
        try {
          return JSON.parse(value);
        } catch {
          return [];
        }
      }

      function parseJsonObject(value) {
        if (!value) return {};
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch {
          return {};
        }
      }

      function readIds() {
        try {
          return new Set(JSON.parse(localStorage.getItem(readKey) || "[]"));
        } catch {
          return new Set();
        }
      }

      function markRead(id) {
        const ids = Array.from(readIds());
        const value = String(id);
        if (!ids.includes(value)) ids.unshift(value);
        localStorage.setItem(readKey, JSON.stringify(ids.slice(0, 1200)));
        const article = articlesEl.querySelector(`article[data-id="${CSS.escape(value)}"]`);
        if (article) {
          article.classList.add("read");
          article.querySelector(".status-pill.new")?.remove();
        }
      }

      function formatBytes(value) {
        const size = Number(value || 0);
        if (size > 1024 * 1024) return `${(size / 1024 / 1024).toFixed(1)} MB`;
        if (size > 1024) return `${(size / 1024).toFixed(1)} KB`;
        return `${size} B`;
      }

      function formatDateTimeParam(date, endOfDay = false) {
        if (!date) return "";
        return `${date} ${endOfDay ? "23:59:59" : "00:00:00"}`;
      }

      function formatArticleTime(value) {
        if (!value) return "";
        const text = String(value);
        const hasTimezone = /[zZ]|[+-]\d{2}:\d{2}$/.test(text);
        const normalized = text.includes("T") || hasTimezone ? text : `${text.replace(" ", "T")}Z`;
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) return text.replace("T", " ").replace(/[+-]\d{2}:\d{2}$/, "");
        const parts = new Intl.DateTimeFormat("sv-SE", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).formatToParts(date);
        const byType = Object.fromEntries(parts.map((part) => [part.type, part.value]));
        return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute}:${byType.second}`;
      }

      function addDateFilters(params) {
        const period = document.querySelector("#period").value;
        document.querySelector("#dateFrom").hidden = period !== "custom";
        document.querySelector("#dateTo").hidden = period !== "custom";
        if (period === "today" || period === "yesterday") {
          const date = new Date();
          if (period === "yesterday") date.setDate(date.getDate() - 1);
          const value = date.toLocaleDateString("sv-SE");
          params.set("collected_from", formatDateTimeParam(value));
          params.set("collected_to", formatDateTimeParam(value, true));
          return;
        }
        if (period === "custom") {
          const from = document.querySelector("#dateFrom").value;
          const to = document.querySelector("#dateTo").value;
          if (from) params.set("collected_from", formatDateTimeParam(from));
          if (to) params.set("collected_to", formatDateTimeParam(to, true));
          return;
        }
        if (period) params.set("collected_within_days", period);
      }

      function playUrgentTone() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const context = new AudioContext();
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = 880;
          gain.gain.setValueAtTime(0.0001, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, context.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.32);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start();
          oscillator.stop(context.currentTime + 0.35);
        } catch {
          return;
        }
      }

      function articleTemplate(item) {
        const score = Number(item.importance_score || 0);
        const priority = score >= 5 ? "high" : score >= 3 ? "medium" : "normal";
        const read = readIds().has(String(item.id));
        const tags = parseJsonList(item.keywords)
          .slice(0, 8)
          .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
          .join("");
        const regions = parseJsonList(item.region_tags)
          .slice(0, 4)
          .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
          .join("");
        const qualityFlags = parseJsonList(item.quality_flags).slice(0, 3).join(", ");
        const assist = item.ai_summary
          ? `<div class="assist">${escapeHtml(item.ai_summary)}\n\n${escapeHtml(item.check_points || "")}</div>`
          : "";
        const sourceDistance = sourceDistanceText(item);
        const display = articleDisplayParts(item);
        const timeLabel = item.published_at ? "발행" : "수집";
        return `
          <article data-id="${item.id}" data-priority="${priority}" class="${read ? "read" : ""} ${String(item.id) === String(selectedArticleId) ? "selected" : ""}">
            <h3><span class="article-label">[제목]</span> <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${highlightSearch(display.title)}</a></h3>
            ${display.body ? `<div class="article-body"><span class="article-label">[기사내용]</span> ${highlightSearch(display.body)}</div>` : ""}
            <div class="meta">
              ${read ? "" : '<span class="status-pill new">NEW</span>'}
              <span>${escapeHtml(item.source_name)}</span>
              <span class="status-pill category-pill ${escapeHtml(item.source_category || "")}">${escapeHtml(categoryLabel(item.source_category))}</span>
              <span>${timeLabel} ${escapeHtml(formatArticleTime(item.published_at || item.collected_at))}</span>
              <span class="score">score ${score.toFixed(1)}</span>
              <span class="status-pill">품질 ${Number(item.quality_score || 0).toFixed(0)}</span>
              <span class="status-pill ${item.verification_status === "needs_review" ? "review" : ""}">${escapeHtml(item.verification_status)}</span>
              <span class="status-pill ${item.newsroom_status === "ready" ? "ready" : ""}">${escapeHtml(item.assignee || "담당자 없음")}</span>
            </div>
            <div class="tags">${tags}${regions}${qualityFlags ? `<span class="tag">${escapeHtml(qualityFlags)}</span>` : ""}</div>
            <div class="source-distance">${escapeHtml(sourceDistance)}</div>
            <div class="workflow">
              <select data-field="newsroom_status">
                ${statusOption("new", "신규", item.newsroom_status)}
                ${statusOption("watching", "확인중", item.newsroom_status)}
                ${statusOption("ready", "방송 후보", item.newsroom_status)}
                ${statusOption("done", "확인완료", item.newsroom_status)}
                ${statusOption("hold", "사용주의", item.newsroom_status)}
              </select>
              <select data-field="verification_status">
                ${statusOption("unchecked", "미확인", item.verification_status)}
                ${statusOption("needs_review", "확인 필요", item.verification_status)}
                ${statusOption("checking", "확인중", item.verification_status)}
                ${statusOption("verified", "확인완료", item.verification_status)}
                ${statusOption("caution", "사용주의", item.verification_status)}
              </select>
              <input data-field="assignee" placeholder="담당자" value="${escapeHtml(item.assignee || "")}" />
              <button data-action="save">저장</button>
              <button data-action="assist">AI 보조</button>
              <button data-action="enrich">상세 수집</button>
              <button data-action="detail">상세</button>
            </div>
            ${assist}
          </article>
        `;
      }

      function statusOption(value, label, selected) {
        return `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`;
      }

      function categoryLabel(value) {
        return {
          disaster: "재난",
          fire: "소방",
          police: "경찰",
          weather: "기상",
          health: "보건",
          government: "정부",
          news: "뉴스",
        }[value] || value || "기타";
      }

      function sourceMatchesLabel(source, label) {
        const aliases = {
          KBS: ["kbs"],
          SBS: ["sbs"],
          MBC: ["mbc"],
          YTN: ["ytn"],
          JTBC: ["jtbc"],
          TV조선: ["tv chosun"],
          채널A: ["channel a"],
          MBN: ["mbn"],
          연합뉴스TV: ["yonhap news tv"],
          조선: ["chosun"],
          동아: ["donga"],
          경향: ["kyunghyang"],
          한겨레: ["hankyoreh"],
          한경: ["hankyung"],
          매경: ["maeil business"],
          머니투데이: ["moneytoday"],
          세계: ["segye"],
          오마이: ["ohmynews"],
          경찰: ["police"],
          소방: ["fire"],
          기상: ["weather"],
          정부: ["government"],
        };
        const name = String(source.name || "").toLowerCase();
        const category = String(source.source_category || "").toLowerCase();
        return (aliases[label] || [label]).some((alias) => name.includes(alias.toLowerCase()) || category === alias.toLowerCase());
      }

      function articleDisplayParts(item) {
        const title = decodeHtmlEntities(item.title || "");
        const summary = decodeHtmlEntities(item.summary || "");
        if (summary) {
          return { title, body: summary };
        }
        if (item.source_name !== "KBS Disaster Portal") {
          return splitLongTitle(title);
        }
        const cleaned = title.replace(/\s+\d{4}\.\d{2}\.\d{2}\s+\(\d{2}:\d{2}\)\s*$/, "");
        const markers = [" KBSLIFE", " [안전토크]", " 이와 관련", " 고령 운전자의", " 일본 지진의"];
        const splitAt = markers
          .map((marker) => cleaned.indexOf(marker))
          .filter((index) => index > 18)
          .sort((a, b) => a - b)[0];
        if (!splitAt) return { title, body: "" };
        return {
          title: cleaned.slice(0, splitAt).trim(),
          body: cleaned.slice(splitAt).trim(),
        };
      }

      function splitLongTitle(title) {
        const text = String(title || "").trim();
        if (text.length < 120) return { title: text, body: "" };
        const markerIndexes = [" [앵커]", " [기자]", " ◇ ", " ◆ ", " 특파원 ", " 기자 "]
          .map((marker) => text.indexOf(marker))
          .filter((index) => index > 12);
        const markerIndex = markerIndexes.sort((a, b) => a - b)[0];
        if (markerIndex) {
          return { title: text.slice(0, markerIndex).trim(), body: text.slice(markerIndex).trim() };
        }
        const sentence = text.match(/^.{35,120}?(?:[.!?]|[다요죠음임까다]\.)\s+/);
        if (sentence) {
          const splitAt = sentence[0].length;
          return { title: text.slice(0, splitAt).trim(), body: text.slice(splitAt).trim() };
        }
        const splitAt = text.lastIndexOf(" ", 100);
        if (splitAt > 35) return { title: text.slice(0, splitAt).trim(), body: text.slice(splitAt).trim() };
        return { title: text, body: "" };
      }

      function sourceDistanceText(item) {
        const sourceCount = Number(item.cluster_source_count || 0);
        const articleCount = Number(item.cluster_article_count || 0);
        if (sourceCount > 1) {
          return `출처 간 거리: 같은 이슈가 ${sourceCount}개 출처, ${articleCount}건에서 확인됨`;
        }
        return "출처 간 거리: 단일 출처 이슈";
      }

      async function loadArticles(options = {}) {
        const requestToken = ++articleLoadToken;
        setArticleLoading(true);
        const q = document.querySelector("#q").value.trim();
        const mode = document.querySelector("#mode").value;
        const source = sourceEl.value;
        const status = document.querySelector("#status").value;
        const sort = document.querySelector("#sort").value;
        try {
          if (options.page) currentPage = options.page;
          if (options.resetPage) currentPage = 1;
          const offset = (currentPage - 1) * pageSize;
          const params = new URLSearchParams({ limit: String(pageSize), offset: String(offset) });
          if (mode === "admin") {
            await loadAdmin();
            return;
          }
          if (mode === "board") {
            await loadBoard();
            return;
          }
          if (options.refreshFirst) {
            await refreshSourcesBeforeSearch();
            if (requestToken !== articleLoadToken) return;
          }
          if (q) params.set("q", q);
          if (source) params.set("source_name", source);
          if (status) params.set("newsroom_status", status);
          if (activeCategory) params.set("source_category", activeCategory);
          if (sort) params.set("sort", sort);
          addDateFilters(params);
          const url =
            mode === "priority"
              ? `/priority?limit=50${activeCategory ? `&source_category=${encodeURIComponent(activeCategory)}` : ""}`
              : mode === "alerts"
                ? `/alerts?limit=50${activeCategory ? `&source_category=${encodeURIComponent(activeCategory)}` : ""}`
                : `/articles?${params.toString()}`;
          const items = await fetchJson(url);
          if (requestToken !== articleLoadToken) return;
          let countInfo = null;
          if (mode === "latest") {
            const countParams = new URLSearchParams(params);
            countParams.delete("limit");
            try {
              countInfo = await fetchJson(`/articles/count?${countParams.toString()}`);
            } catch {
              countInfo = null;
            }
            if (requestToken !== articleLoadToken) return;
          }
          const totalCount = countInfo?.count ?? items.length;
          const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
          if (currentPage > totalPages) {
            currentPage = totalPages;
            return loadArticles({ page: currentPage });
          }
          articlesEl.innerHTML = items.length
            ? items.map(articleTemplate).join("")
            : '<div class="empty">표시할 기사가 없습니다.</div>';
          if (mode === "latest" && totalPages > 1) {
            articlesEl.insertAdjacentHTML("beforeend", paginationTemplate(currentPage, totalPages));
          }
          const unread = items.filter((item) => !readIds().has(String(item.id))).length;
          if (lastArticleCount !== undefined && items.length > lastArticleCount) {
            showToast(`새 기사 ${items.length - lastArticleCount}건이 목록에 표시됐습니다.`);
          }
          lastArticleCount = items.length;
          const resultLabel = q || source || status || activeCategory ? "검색 결과" : "목록";
          const start = items.length ? offset + 1 : 0;
          const end = offset + items.length;
          const resultCount = countInfo ? `${start}-${end}/${countInfo.count}건` : `${items.length}건`;
          liveStatusEl.textContent = `${resultLabel} ${resultCount} · 미확인 ${unread}건 · ${new Date().toLocaleTimeString("ko-KR")}`;
        } finally {
          if (requestToken === articleLoadToken) setArticleLoading(false);
        }
      }

      function paginationTemplate(page, totalPages) {
        const pages = visiblePages(page, totalPages);
        return `
          <nav class="pagination" aria-label="기사 페이지">
            <button data-page="${Math.max(1, page - 1)}" ${page === 1 ? "disabled" : ""}>이전</button>
            ${pages
              .map((item) =>
                item === "..."
                  ? "<span>...</span>"
                  : `<button data-page="${item}" class="${item === page ? "active" : ""}">${item}</button>`,
              )
              .join("")}
            <button data-page="${Math.min(totalPages, page + 1)}" ${page === totalPages ? "disabled" : ""}>다음</button>
          </nav>
        `;
      }

      function visiblePages(page, totalPages) {
        const pages = new Set([1, totalPages, page, page - 1, page + 1]);
        if (page <= 3) [2, 3, 4].forEach((item) => pages.add(item));
        if (page >= totalPages - 2) [totalPages - 3, totalPages - 2, totalPages - 1].forEach((item) => pages.add(item));
        const sorted = Array.from(pages)
          .filter((item) => item >= 1 && item <= totalPages)
          .sort((a, b) => a - b);
        return sorted.flatMap((item, index) => (index && item - sorted[index - 1] > 1 ? ["...", item] : [item]));
      }

      async function loadBoard() {
        const statuses = [
          ["new", "신규"],
          ["watching", "확인중"],
          ["ready", "방송 후보"],
          ["done", "확인완료"],
          ["hold", "사용주의"],
        ];
        const columns = await Promise.all(
          statuses.map(async ([value, label]) => {
            const params = new URLSearchParams({ limit: "20", newsroom_status: value });
            if (activeCategory) params.set("source_category", activeCategory);
            addDateFilters(params);
            const items = await fetchJson(`/articles?${params.toString()}`);
            return { value, label, items };
          }),
        );
        articlesEl.innerHTML = `
          <div class="board">
            ${columns
              .map(
                (column) => `
                  <section class="board-column">
                    <h3>${escapeHtml(column.label)} · ${column.items.length}</h3>
                    ${column.items
                      .map(
                        (item) => `
                          <div class="board-card" data-id="${item.id}">
                            <strong>${escapeHtml(item.title)}</strong><br />
                            ${escapeHtml(categoryLabel(item.source_category))} · score ${Number(item.importance_score || 0).toFixed(1)}
                          </div>
                        `,
                      )
                      .join("") || '<div class="empty">없음</div>'}
                  </section>
                `,
              )
              .join("")}
          </div>
        `;
        liveStatusEl.textContent = `보드 갱신 · ${new Date().toLocaleTimeString("ko-KR")}`;

      async function loadSchedulerStatus() {
        const status = await fetchJson("/scheduler/status");
        renderSchedulerStatus(status);
      }

      function renderSchedulerStatus(status) {
        const last = status.last_run;
        const level = status.running_count ? "warning" : status.failed_24h ? "danger" : "";
        const progress = status.progress || {};
        const total = Number(progress.total || 0);
        const index = Number(progress.index || 0);
        const percent = total ? Math.min(100, Math.round((index / total) * 100)) : 0;
        const progressText =
          progress.status === "running" && total
            ? `수집 중 ${index}/${total} · ${progress.current_source || "출처 확인 중"}`
            : "수집 대기";
        schedulerStatusEl.innerHTML = `
          <div class="stat ${level}"><span>현재 실행</span><strong>${status.running_count ? `${status.running_count}건` : "대기"}</strong></div>
          <div class="crawl-progress">
            <strong>${escapeHtml(progressText)}</strong>
            <div class="progress-track"><div class="progress-bar" style="width: ${percent}%"></div></div>
          </div>
          <div class="stat"><span>최근 상태</span><strong>${escapeHtml(last?.status || "-")}</strong></div>
          <div class="stat"><span>최근 출처</span><strong>${escapeHtml(last?.source_name || "-")}</strong></div>
          <div class="stat"><span>24시간 실패</span><strong>${status.failed_24h}</strong></div>
        `;
      }

      function startCrawlProgressPolling() {
        stopCrawlProgressPolling();
        crawlProgressTimer = setInterval(async () => {
          try {
            const status = await fetchJson("/scheduler/status");
            renderSchedulerStatus(status);
            const progress = status.progress || {};
            if (progress.status === "running" && Number(progress.total || 0)) {
              liveStatusEl.textContent = `수집 중 ${progress.index}/${progress.total} · ${progress.current_source || "출처 확인 중"}`;
            }
          } catch {
            return;
          }
        }, 1000);
      }

      function stopCrawlProgressPolling() {
        if (!crawlProgressTimer) return;
        clearInterval(crawlProgressTimer);
        crawlProgressTimer = undefined;
      }

      function toggleLiveSearch() {
        if (liveRefreshRunning) {
          fetchJson("/crawl/cancel", { method: "POST" })
            .then(() => showToast("현재 수집을 중지 요청했습니다."))
            .catch((error) => showToast(error.message));
        }
        if (liveSearchTimer) {
          clearInterval(liveSearchTimer);
          liveSearchTimer = undefined;
          setLiveSearchState(false);
          liveStatusEl.textContent = `실시간 조회 중지 · ${new Date().toLocaleTimeString("ko-KR")}`;
          return;
        }
        setLiveSearchState(true);
        showToast("1분마다 현재 검색 조건으로 실시간 수집합니다.");
        runSearch();
        liveSearchTimer = setInterval(() => {
          if (liveRefreshRunning) return;
          loadArticles({ refreshFirst: true }).catch((error) => {
            showToast(error.message);
            toggleLiveSearch();
          });
        }, 60000);

      document.querySelector("#exportCue").addEventListener("click", () => {
        const params = new URLSearchParams({ limit: "100", newsroom_status: "ready" });
        if (activeCategory) params.set("source_category", activeCategory);
        addDateFilters(params);
        window.open(`/exports/cuesheet.txt?${params.toString()}`, "_blank");
      });
      document.querySelector("#backupDb").addEventListener("click", async () => {
        const result = await fetchJson("/maintenance/backup", { method: "POST" });
        showToast(`백업 완료: ${result.backup_path}`);
        loadStats();
      });
      document.querySelector("#rebuildClusters").addEventListener("click", async () => {
        await fetchJson("/clusters/rebuild?limit=1000", { method: "POST" });
        showToast("이슈 묶음을 재계산했습니다.");
        await loadClusters();
      });
      document.querySelector("#pruneAlerts").addEventListener("click", async () => {
        const result = await fetchJson("/maintenance/prune-alerts?days=14", { method: "POST" });
        showToast(`오래된 알림 ${result.deleted_alerts}건을 정리했습니다.`);
        await Promise.all([loadAlertEvents(), loadStats()]);
      });
      document.querySelector("#ackAllAlerts").addEventListener("click", async () => {
        const result = await fetchJson("/alert-events/ack-all", { method: "POST" });
        showToast(`알림 ${result.acknowledged}건을 확인 처리했습니다.`);
        await Promise.all([loadAlertEvents(), loadStats()]);
      });
      document.querySelector("#validateConfig").addEventListener("click", async () => {
        const result = await fetchJson("/admin/validate");
        showToast(result.ok ? "설정 정상" : result.errors.join("\\n"));
      });
      clustersEl.addEventListener("click", (event) => {
        const item = event.target.closest("[data-cluster-id]");
        if (item) showClusterDetail(item.dataset.clusterId).catch((error) => showToast(error.message));
      });
      urgentRailEl.addEventListener("click", (event) => {
        const item = event.target.closest("[data-id]");
        if (item) showDetail(item.dataset.id).catch((error) => showToast(error.message));
      });
      articlesEl.addEventListener("click", (event) => {
        const pageButton = event.target.closest(".pagination button[data-page]");
        if (pageButton) {
          const page = Number(pageButton.dataset.page);
          if (Number.isFinite(page) && page !== currentPage) {
            loadArticles({ page }).catch((error) => showToast(error.message));
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
          return;
        }
        const compareRow = event.target.closest(".compare-table tr[data-id]");
        if (compareRow) {
          showDetail(compareRow.dataset.id).catch((error) => showToast(error.message));
          return;
        }
        if (event.target.dataset.sourceId) {
          fetchJson(`/sources/${event.target.dataset.sourceId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled: event.target.dataset.sourceEnabled === "1" }),
          }).then(loadAdmin).catch((error) => showToast(error.message));
          return;
        }
        if (event.target.dataset.sourceSave) {
          const id = event.target.dataset.sourceSave;
          const interval = Number(articlesEl.querySelector(`[data-source-interval="${CSS.escape(id)}"]`)?.value || 300);
          fetchJson(`/sources/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ crawl_interval_seconds: interval }),
          })
            .then(() => {
              showToast("출처 수집 주기를 저장했습니다.");
              return loadAdmin();
            })
            .catch((error) => showToast(error.message));
          return;
        }
        if (event.target.dataset.backupRestore) {
          const name = event.target.dataset.backupRestore;
          if (!confirm(`${name} 백업으로 복구할까요? 현재 DB는 안전 백업 후 교체됩니다.`)) return;
          fetchJson(`/maintenance/restore/${encodeURIComponent(name)}`, { method: "POST" })
            .then(() => {
              showToast("백업 복구가 완료됐습니다. 서버 재시작 후 확인하세요.");
              return loadAdmin();
            })
            .catch((error) => showToast(error.message));
          return;
        }
        const boardCard = event.target.closest(".board-card");
        if (boardCard) {
          showDetail(boardCard.dataset.id).catch((error) => showToast(error.message));
          return;
        }
        const action = event.target.dataset.action;
        const article = event.target.closest("article");
        if (!action && event.target.closest("input, textarea, select, button, a")) return;
        if (!action && article) {
          showDetail(article.dataset.id).catch((error) => showToast(error.message));
          return;
        }
        if (!action || !article) return;
        if (action === "save-keywords") {
          const groups = {};
          articlesEl.querySelectorAll("[data-keyword-group]").forEach((field) => {
            groups[field.dataset.keywordGroup] = field.value
              .split(",")
              .map((keyword) => keyword.trim())
              .filter(Boolean);
          });
          fetchJson("/admin/keywords", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ groups }),
          })
            .then(() => showToast("키워드 룰을 저장했습니다. 다음 수집/재계산부터 반영됩니다."))
            .catch((error) => showToast(error.message));
          return;
        }
        if (action === "save") saveWorkflow(article);
        if (action === "assist") buildAssist(article);
        if (action === "enrich") enrichArticle(article);
        if (action === "detail") showDetail(article.dataset.id);
      });

      detailPanelEl.addEventListener("click", async (event) => {
        if (event.target.dataset.action === "panel-assist") {
          const id = event.target.dataset.id;
          await fetchJson(`/articles/${id}/ai-assist`, { method: "POST" });
          showToast("AI 검토를 생성했습니다.");
          await showDetail(id);
          return;
        }
        if (event.target.dataset.action !== "save-checklist") return;
        const id = event.target.dataset.id;
        const checklist = {};
        detailPanelEl.querySelectorAll("[data-check]").forEach((field) => {
          checklist[field.dataset.check] = field.checked;
        });
        await fetchJson(`/articles/${id}/checklist`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verification_checklist: checklist }),
        });
        showToast("체크리스트를 저장했습니다.");
      });

      async function refreshDashboard() {
        await Promise.all([
          loadStats(),
          loadSchedulerStatus(),
          loadArticles(),
        ]);
        scheduleSecondaryRefresh();
      }

      function deferWork(task, delay = 0) {
        const run = () => task().catch((error) => showToast(error.message));
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(run, { timeout: 2500 + delay });
          return;
        }
        setTimeout(run, delay);
      }

      function scheduleSecondaryRefresh() {
        const tasks = [
          loadUrgentRail,
          loadRuns,
          loadAlertEvents,
          loadClusters,
          loadOperations,
          loadSourceQuality,
        ];
        tasks.forEach((task, index) => deferWork(task, 120 * index));
      }

      async function bootDashboard() {
        liveStatusEl.textContent = "초기 화면 로딩 중";
        await loadSources();
        await Promise.all([loadArticles(), loadStats(), loadSchedulerStatus()]);
        liveStatusEl.textContent = `초기 화면 준비 완료 · ${new Date().toLocaleTimeString("ko-KR")}`;
        scheduleSecondaryRefresh();
      }

      bootDashboard()
        .catch((error) => showToast(error.message));

      setInterval(() => {
        refreshDashboard().catch((error) => showToast(error.message));
      }, 60000);
    </script>
  </body>
</html>
