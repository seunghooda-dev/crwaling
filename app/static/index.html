              </div>
            `;
          })
          .join("");
      }

      function failureDiagnosticsTemplate(diagnostics) {
        const causes = diagnostics.cause_counts || [];
        const actions = diagnostics.action_items || [];
        const failedCount = Number(diagnostics.failed_run_count || 0);
        const currentRisk = Number(diagnostics.current_risk_count || 0);
        const level = currentRisk ? "warning" : failedCount ? "diagnostic" : "diagnostic";
        const causeHtml = causes.length
          ? causes
              .slice(0, 4)
              .map(
                (cause) =>
                  `<span class="warning-chip ${cause.severity === "danger" ? "danger" : "warning"}">${escapeHtml(cause.label)} ${cause.count}</span>`,
              )
              .join("")
          : currentRisk
            ? `<span class="warning-chip">연결 실패 없음</span><span class="warning-chip warning">지연 관찰 ${currentRisk}곳</span>`
            : '<span class="warning-chip">최근 실패 없음</span>';
        const actionHtml = actions.length
          ? actions
              .slice(0, 3)
              .map((item) => `<span>${escapeHtml(item.source_name || "")} · ${escapeHtml(item.action || "")}</span>`)
              .join("<br />")
          : currentRisk
            ? "<span>실패 원인은 없고, 수집 주기 지연 또는 중복 유입 여부만 관찰 중입니다.</span>"
            : "<span>현재 출처별 즉시 조치 대상은 없습니다.</span>";
        const diagnosticSummary = failedCount
          ? `실패 ${failedCount}건 · 현재 경고 ${currentRisk}곳 · 재시도 가능 ${diagnostics.retryable_count || 0}건`
          : `실패 없음 · 지연 관찰 ${currentRisk}곳 · 연결 정상`;
        return `
          <div class="source-warning-card ${level}">
            <div class="source-warning-head">
              <strong>실패·지연 요약</strong>
              <span class="source-warning-label">최근 ${diagnostics.window_hours || 24}시간</span>
            </div>
            <div class="source-warning-meta">${causeHtml}</div>
            <div class="summary">${diagnosticSummary}</div>
            <div class="summary">${actionHtml}</div>
          </div>
        `;
      }

      function sourceWarningText(source) {
        if (source.zero_new_status === "stalled") {
          return `마지막 실행이 ${formatDurationShort(source.seconds_since_last_run)}부터 완료되지 않았습니다. 서버 재시작이나 중간 중단으로 실행 기록이 멈췄을 수 있습니다.`;
        }
        if (source.zero_new_status === "repeated_failed") {
          const count = Number(source.failure_streak || 2);
          const cause = source.failure_cause_label ? `${source.failure_cause_label}. ` : "";
          const hint = source.failure_hint || "URL, 리다이렉트, 접속 차단 여부를 확인하세요.";
          const action = source.failure_action ? ` ${source.failure_action}` : "";
          return `최근 ${count}회 연속 수집이 실패했습니다. ${cause}${hint}${action}`;
        }
        if (source.zero_new_status === "transient_failed") {
          const cause = source.failure_cause_label ? `${source.failure_cause_label}. ` : "";
          const hint = source.failure_hint || "일시적인 네트워크 오류일 수 있습니다.";
          return `마지막 1회 수집만 실패했습니다. ${cause}${hint}`;
        }
        if (source.last_status === "failed") {
          return source.last_error_message || "최근 수집이 실패했습니다. URL, 리다이렉트, 접속 차단 여부를 확인하세요.";
        }
        if (source.zero_new_status === "never_crawled") {
          return "아직 한 번도 수집되지 않았습니다. 출처 등록 직후라면 즉시 수집을 실행하세요.";
        }
        if (source.zero_new_status === "stale" || source.zero_new_status === "stale_watch") {
          return "예정된 주기보다 수집이 늦어졌습니다. 자동 수집기 실행 여부와 네트워크 상태를 확인하세요.";
        }
        if (source.zero_new_status === "global_idle") {
          return "전체 수집이 쉬고 있는 상태입니다. 개별 출처 선택자보다 자동 수집 실행 상태를 먼저 확인하세요.";
        }
        if (source.zero_new_status === "selector_check") {
          return "기사 누적이 없고 0건 수집이 반복됐습니다. 사이트 구조나 선택자 변경 가능성이 큽니다.";
        }
        if (source.zero_new_status === "empty_fetch_watch") {
          return `최근 성공 수집 ${source.empty_fetch_streak}회가 모두 빈 응답입니다. 목록 선택자나 접속 차단 여부를 확인하세요.`;
        }
        if (source.zero_new_status === "low_success_rate") {
          return "최근 수집 성공률이 낮습니다. timeout, 재시도, 사이트 접속 차단 가능성을 확인하세요.";
        }
        if (source.zero_new_status === "duplicate_only") {
          return "기사 목록은 읽었지만 새 URL은 없었습니다. 수집기는 동작 중입니다.";
        }
        return "현재 정상 범위입니다.";
      }

      function sourceWarningMeta(source) {
        const items = [];
        if (source.failure_cause_label) items.push(source.failure_cause_label);
        if (Number(source.failure_streak || 0) > 0) items.push(`연속 ${source.failure_streak}회`);
        if (source.success_rate !== null && source.success_rate !== undefined) items.push(`성공률 ${source.success_rate}%`);
        items.push(formatDurationShort(source.seconds_since_last_run));
        return items.slice(0, 4);
      }

          ${stats.categories

      function renderRegionStats(regions) {

          ? `<div class="region-list">

                .map(
                  (row) => `
                    <button class="region-row ${selected === row.region_group ? "active" : ""}" data-region-group="${escapeHtml(row.region_group)}">
                      <span>${escapeHtml(row.label)}</span>
                      <strong>${Number(row.count || 0)}</strong>

                .join("")}

      function runSearch() {
        const q = document.querySelector("#q").value.trim();
        if (!q && !hasArticleFilters()) {
          liveStatusEl.textContent = "전체기사 조회";
          loadArticles({ resetPage: true, allArticles: true }).catch((error) => showToast(error.message));

        loadArticles({ resetPage: true }).catch((error) => showToast(error.message));

      function applyCollectionStatusFilter(filter) {
        resetFilters();

        if (filter === "all") {
          showToast("전체 기사 목록을 조회합니다.");

          document.querySelector("#mode").value = "admin";

          loadArticles({ resetPage: true }).catch((error) => showToast(error.message));
          loadStats().catch((error) => showToast(error.message));
          return;
        }
        if (filter === "alerts") {
          alertOnly = true;
          showToast("새 알림 기사만 조회합니다.");

        if (filter === "ready") {
          document.querySelector("#status").value = "ready";
          showToast("방송 후보 기사만 조회합니다.");
        }
        if (filter === "needs-work") {
          riskOnly = true;
          localStorage.setItem(riskOnlyKey, "1");
          riskOnlyEl.classList.add("active");
          showToast("보강필요 기사만 조회합니다.");
        }
        if (filter === "needs-review") {
          reviewOnly = true;
          showToast("확인필요 기사만 조회합니다.");
        }
        if (filter === "missing-author") {
          missingAuthorOnly = true;
          showToast("기자명 없는 기사만 조회합니다.");
        }
        if (filter === "has-body") {
          bodyOnly = true;
          showToast("상세 수집된 기사만 조회합니다.");
        }
        if (filter === "needs-detail") {
          detailOnly = true;
          showToast("우선 보강 대상 기사만 조회합니다.");
        }
        if (filter === "search-index") {
          showToast("검색 가능한 전체 기사 목록을 조회합니다.");
        }
        if (filter === "latest") {
          showToast("최근 수집순으로 기사 목록을 조회합니다.");
        }
        loadArticles({ resetPage: true }).catch((error) => showToast(error.message));
        loadStats().catch((error) => showToast(error.message));
      }

      function applyCollectionCategoryFilter(category) {
        resetFilters();
        document.querySelector("#mode").value = "latest";
        activeCategory = category || "";
        document.querySelectorAll("#quickbar button").forEach((button) => {
          button.classList.toggle("active", button.dataset.category === activeCategory);
        });
        showToast(`${categoryLabel(activeCategory)} 기사만 조회합니다.`);
        loadArticles({ resetPage: true }).catch((error) => showToast(error.message));
        loadStats().catch((error) => showToast(error.message));
      }

      async function collectNow() {
        await loadArticles({ refreshFirst: true, resetPage: true });
        await loadReporterDesk();
      }

      function setLiveSearchState(active) {
        liveSearchButtonEl.classList.toggle("live-active", active);
        liveSearchButtonEl.textContent = active ? "실시간 중지" : "실시간 조회";
        liveSearchButtonEl.title = active ? "1분마다 현재 검색 조건으로 새로 수집합니다." : "현재 검색 조건을 1분마다 실시간 수집합니다.";
      }

      function toggleLiveSearch() {
        if (liveRefreshRunning) {
          fetchJson("/crawl/cancel", { method: "POST" })
            .then(() => showToast("현재 수집을 중지 요청했습니다."))
            .catch((error) => showToast(error.message));
        }
        if (liveSearchTimer) {
          clearInterval(liveSearchTimer);
          liveSearchTimer = undefined;
          setLiveSearchState(false);
          liveStatusEl.textContent = `실시간 조회 중지 · ${new Date().toLocaleTimeString("ko-KR")}`;
          return;
        }
        setLiveSearchState(true);
        showToast("1분마다 현재 검색 조건으로 실시간 수집합니다.");
        runSearch();
        liveSearchTimer = setInterval(() => {
          if (liveRefreshRunning) return;
          loadArticles({ refreshFirst: true }).catch((error) => {
            showToast(error.message);
            toggleLiveSearch();
          });
        }, 60000);
      }

      document.querySelector("#sourcebar").addEventListener("click", (event) => {
        if (event.target.dataset.sourceName === undefined) return;
        const sourceName = event.target.dataset.sourceName;
        if (!sourceName) {
          setSelectedSources([]);
        } else {
          const selected = new Set(selectedSourceNames());
          if (selected.has(sourceName)) {
            selected.delete(sourceName);
          } else {
            selected.add(sourceName);
          }
          setSelectedSources([...selected]);
        }
        loadArticles({ resetPage: true }).catch((error) => showToast(error.message));

        showToast(

        );

      document.querySelector("#ackAllAlerts").addEventListener("click", async () => {

      document.querySelector("#validateConfig").addEventListener("click", async () => {

      document.querySelector("#telegramTest").addEventListener("click", () => {

      });
      urgentRailEl.addEventListener("click", (event) => {
        const thresholdButton = event.target.closest("[data-urgent-threshold]");
        if (thresholdButton) {

          localStorage.setItem(urgentThresholdKey, String(urgentThreshold));
          loadUrgentRail().catch((error) => showToast(error.message));
          return;
        }
        const action = event.target.closest("[data-urgent-action]");
        if (action) {
          if (action.dataset.urgentAction === "open") return;
          const id = action.dataset.id;
          if (action.dataset.urgentAction === "ready") {
            fetchJson(`/articles/${id}/workflow`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ newsroom_status: "ready" }),
            })
              .then(() => {
                showToast("방송 후보로 표시했습니다.");
                return Promise.all([loadUrgentRail(), loadArticles()]);
              })
              .catch((error) => showToast(error.message));
            return;
          }
          if (action.dataset.urgentAction === "copy") {
            copyArticleBrief(id).catch((error) => showToast(error.message));
            return;
          }
          if (action.dataset.urgentAction === "telegram") {
            sendArticleTelegram(id).catch((error) => showToast(error.message));

        if (pageButton) {
          const page = Number(pageButton.dataset.page);
          if (Number.isFinite(page) && page !== currentPage) {

          }).then(loadAdmin).catch((error) => showToast(error.message));

            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ crawl_interval_seconds: interval }),
          })
            .then(() => {
              showToast("출처 수집 주기를 저장했습니다.");
              return loadAdmin();

            .catch((error) => showToast(error.message));
          return;

        if (event.target.dataset.backupRestore) {

          fetchJson(`/maintenance/restore/${encodeURIComponent(name)}`, { method: "POST" })
            .then(() => {

          return;
        }
        const boardCard = event.target.closest(".board-card");
        if (boardCard) {
          showDetail(boardCard.dataset.id).catch((error) => showToast(error.message));
          return;
        }
        const action = event.target.dataset.action;
        const article = event.target.closest("article");
        if (!action && event.target.closest("input, textarea, select, button, a")) return;
        if (!action && article) {
          showDetail(article.dataset.id).catch((error) => showToast(error.message));
          return;
        }
        if (!action || !article) return;
        if (action === "save-keywords") {
          const groups = {};
          articlesEl.querySelectorAll("[data-keyword-group]").forEach((field) => {
            groups[field.dataset.keywordGroup] = field.value
              .split(",")
              .map((keyword) => keyword.trim())
              .filter(Boolean);
          });
          fetchJson("/admin/keywords", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ groups }),
          })
            .then(() => showToast("키워드 룰을 저장했습니다. 다음 수집/재계산부터 반영됩니다."))
            .catch((error) => showToast(error.message));
          return;
        }
        if (action === "save") saveWorkflow(article);
        if (action === "copy") copyArticleBrief(article.dataset.id).catch((error) => showToast(error.message));
        if (action === "telegram") sendArticleTelegram(article.dataset.id).catch((error) => showToast(error.message));
        if (action === "assist") buildAssist(article);
        if (action === "enrich") enrichArticle(article);
        if (action === "detail") showDetail(article.dataset.id);
      });

      detailPanelEl.addEventListener("click", async (event) => {
        if (event.target.dataset.action === "panel-copy") {
          await copyArticleBrief(event.target.dataset.id);
          return;
        }
        if (event.target.dataset.action === "panel-telegram") {
          await sendArticleTelegram(event.target.dataset.id);
          return;
        }
        if (event.target.dataset.action === "panel-assist") {
          const id = event.target.dataset.id;
          await fetchJson(`/articles/${id}/ai-assist`, { method: "POST" });
          showToast("AI 검토를 생성했습니다.");
          await showDetail(id);
          return;
        }
        if (event.target.dataset.action === "save-contact-log") {
          const id = event.target.dataset.id;
          const form = detailPanelEl.querySelector(`[data-contact-form="${CSS.escape(String(id))}"]`);
          const target = form?.querySelector("[data-contact-target]")?.value.trim() || "";
          const note = form?.querySelector("[data-contact-note]")?.value.trim() || "";
          const next = form?.querySelector("[data-contact-next]")?.value || null;
          if (!target || !note) {
            showToast("확인 대상과 답변 내용을 입력하세요.");
            return;
          }
          await fetchJson(`/articles/${id}/contact-logs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contact_target: target, response_note: note, next_check_at: next }),
          });
          showToast("콜로그를 저장했습니다.");
          await showDetail(id);
          return;
        }
        if (event.target.dataset.action !== "save-checklist") return;
        const id = event.target.dataset.id;
        const checklist = {};
        detailPanelEl.querySelectorAll("[data-check]").forEach((field) => {
          checklist[field.dataset.check] = field.checked;
        });
        await fetchJson(`/articles/${id}/checklist`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verification_checklist: checklist }),
        });
        showToast("체크리스트를 저장했습니다.");
      });

      async function refreshDashboard() {
        if (dashboardRefreshRunning) return;
        dashboardRefreshRunning = true;
        try {
          await Promise.all([
            loadStats(),
            loadReporterDesk(),
            loadDetailQueue(),
            loadCommandCenter(),
            loadSchedulerStatus(),
            loadCoverageOverview(),
            loadNotificationStatus(),
            loadArticles(),
          ]);
          scheduleSecondaryRefresh();
        } finally {
          dashboardRefreshRunning = false;
        }
      }

      function deferWork(task, delay = 0) {
        const run = () => task().catch((error) => showToast(error.message));
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(run, { timeout: 2500 + delay });
          return;
        }
        setTimeout(run, delay);
      }

      function scheduleSecondaryRefresh() {
        const tasks = [
          loadUrgentRail,
          loadReporterDesk,
          loadDetailQueue,
          loadCommandCenter,
          loadCoverageOverview,
          loadRuns,
          loadAlertEvents,
          loadClusters,
          loadOperations,
          loadNotificationStatus,
          loadSourceQuality,
        ];
        tasks.forEach((task, index) => deferWork(task, 120 * index));
      }

      async function bootDashboard() {
        liveStatusEl.textContent = "초기 화면 로딩 중";
        await loadSources();
        if (missionMode) applyMissionDefaults();
        localStorage.removeItem("newsroom-recent-searches");
        await Promise.all([loadArticles(), loadStats(), loadReporterDesk(), loadDetailQueue(), loadCommandCenter(), loadSchedulerStatus(), loadCoverageOverview(), loadNotificationStatus()]);
        liveStatusEl.textContent = `초기 화면 준비 완료 · ${new Date().toLocaleTimeString("ko-KR")}`;
        scheduleSecondaryRefresh();
      }

      bootDashboard()
        .catch((error) => showToast(error.message));

      setInterval(() => {
        refreshDashboard().catch((error) => showToast(error.message));
      }, 60000);
    </script>
  </body>
</html>
